  // CARTERA
  function loadCartera(){
    var host=sec("cartera"); host.innerHTML='<div class="loading">Cargando…</div>';
    base("cartera").then(function(res){
      if(state.section!=="cartera") return;
      var rows=(res.data||[]).slice();
      rows.sort(function(a,b){ return Number(b.saldo)-Number(a.saldo); });
      var porCobrar=rows.filter(function(r){return Number(r.saldo)>0;}).reduce(function(s,r){return s+Number(r.saldo);},0);
      var mora=rows.filter(function(r){ return r.dias_sin_abono!=null && r.dias_sin_abono>21 && Number(r.saldo)>0; }).length;
      var h='<div class="sechead"><h2 class="sec">Cartera de clientes</h2><button class="xls" data-xls="cartera">⬇️ Excel</button></div>';
      h+='<div class="tiles"><div class="tile"><div class="lab">👥 Por cobrar</div><div class="val num">'+money(porCobrar)+'</div></div>'
        +'<div class="tile"><div class="lab">🔴 En mora (+21d)</div><div class="val num">'+mora+'</div></div></div>';
      if(!rows.length){ h+='<div class="empty">No hay clientes con saldo.</div>'; host.innerHTML=h; return; }
      h+='<input class="tbus" id="carBus" type="search" placeholder="🔎 Buscar cliente por nombre…" value="'+esc(state.carteraBuscar||"")+'" style="margin-top:12px">';
      h+='<div class="card" id="cartera-lista"></div>';
      h+='<div class="card"><div class="total-row"><span>Total por cobrar</span><span class="big num">'+money(porCobrar)+'</span></div></div>';
      h+='<p class="updated">Toca un cliente para ver su estado de cuenta</p>';
      host.innerHTML=h;
      var lista=el("cartera-lista");
      // Filtro por nombre (sin tildes ni mayúsculas): repinta solo la lista, el buscador conserva el foco.
      function sinTildes(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); }
      function pintarLista(){
        var q=sinTildes(state.carteraBuscar||"").trim();
        lista.innerHTML="";
        var vis=rows.filter(function(c){ return !q || sinTildes(c.nombre).indexOf(q)>=0; });
        if(!vis.length){ lista.innerHTML='<div class="empty">Ningún cliente con ese nombre.</div>'; return; }
        vis.forEach(function(c){
          var fav=Number(c.saldo)<0;
          var b=document.createElement("button"); b.className="row";
          var amt= fav ? ('<div class="amt num fav">−'+money(Math.abs(c.saldo))+'</div>') : ('<div class="amt num">'+money(c.saldo)+'</div>');
          var pill= fav ? '<span class="pill good">a favor</span>'
            : (c.dias_sin_abono!=null ? '<span class="pill '+claseDias(c.dias_sin_abono)+'">'+c.dias_sin_abono+' d</span>' : '');
          var meta= fav ? "Saldo a favor" : (c.dias_sin_abono!=null ? ("Último abono: hace "+c.dias_sin_abono+" días") : "");
          b.innerHTML='<div class="main"><div class="name">'+esc(c.nombre)+'</div><div class="meta">'+meta+'</div></div>'
            +'<div class="stk">'+amt+pill+'</div><span class="chev">›</span>';
          b.addEventListener("click", function(){ verCliente(c); });
          lista.appendChild(b);
        });
      }
      el("carBus").addEventListener("input", function(){ state.carteraBuscar=this.value; pintarLista(); });
      pintarLista();
      state.cache.cartera=rows;
    });
  }
  function claseDias(d){ if(d>21) return "bad"; if(d>14) return "warn"; if(d>7) return "info"; return "good"; }

  // BALANCE CLIENTE
  // Rápido: trae solo los últimos movimientos (no toda la historia) y calcula el saldo HACIA ATRÁS
  // desde el saldo actual del cliente; lo anterior queda resumido en una fila "Saldo anterior".
  // "Ver todo" trae la historia completa. Tocar una venta abre su factura para descargar/compartir.
  var MOVS_RAPIDO=120;
  function verCliente(c, todo){
    var host=sec("cliente"); showSection("cliente"); state.section="cliente";
    var volver=function(){ state.section="cartera"; render(); };
    var fav=Number(c.saldo)<0;
    var cab='<button class="back" id="volver2">‹ Volver a cartera</button>'
      +'<div class="sechead" style="margin-top:6px"><h2 class="sec">'+esc(c.nombre)+'</h2><button class="xls" data-xls="cliente">⬇️ Excel</button></div>'
      +'<div class="tiles"><div class="tile span"><div class="lab">'+(fav?"Saldo a favor":"Debe actualmente")+'</div><div class="val num" style="'+(fav?'color:var(--good)':'')+'">'+(fav?"−":"")+money(Math.abs(c.saldo))+'</div></div></div>';
    host.innerHTML=cab+'<div class="loading">Cargando movimientos…</div>';
    el("volver2").onclick=volver;
    function consulta(cols){
      var qy=sb.from("cliente_movimiento").select(cols)
        .eq("negocio_id", state.negocioId).eq("cliente_id", c.cliente_id).order("fecha",{ascending:false});
      return todo ? qy : qy.limit(MOVS_RAPIDO+1);
    }
    // Si la nube aún no tiene la columna venta_id (SQL nuevo sin correr), se carga igual sin el botón 🧾.
    consulta("ref,fecha,tipo,detalle,cargo,abono,venta_id").then(function(res){
      return res.error ? consulta("ref,fecha,tipo,detalle,cargo,abono") : res;
    }).then(function(res){
      if(state.section!=="cliente") return;
      if(res.error){ host.innerHTML=cab+'<div class="empty">No se pudo cargar: '+esc(res.error.message)+'</div>'; el("volver2").onclick=volver; return; }
      var desc=res.data||[];
      var hayMas=!todo && desc.length>MOVS_RAPIDO; if(hayMas) desc=desc.slice(0,MOVS_RAPIDO);
      // Saldo después de cada movimiento, del más nuevo al más viejo, partiendo del saldo actual.
      var s=Number(c.saldo||0);
      desc.forEach(function(m){ m._saldo=s; s-=Number(m.cargo)-Number(m.abono); });
      var saldoAnterior=s, movs=desc.slice().reverse();
      var h=cab;
      if(!movs.length){ h+='<div class="empty">Sin movimientos registrados.</div>'; host.innerHTML=h; el("volver2").onclick=volver; return; }
      // Lo más reciente ARRIBA (pedido del dueño): se recorre del más nuevo al más viejo; el saldo de
      // cada fila es el que quedó después de ese movimiento, y el "Saldo anterior" va al final.
      var filas="";
      desc.forEach(function(m){
        var f=new Date(m.fecha).toLocaleDateString("es-CO",{day:"2-digit",month:"short"});
        var esVenta=m.venta_id!=null;
        filas+='<tr'+(esVenta?' class="vta" data-v="'+m.venta_id+'"':'')+'><td>'+f+'</td><td style="text-align:left">'+esc(m.detalle||cap(m.tipo))+(esVenta?' <span class="fbtn" aria-label="Ver factura">🧾</span>':'')+'</td>'
          +'<td class="num c-cargo">'+(Number(m.cargo)?money(m.cargo):"")+'</td>'
          +'<td class="num c-abono">'+(Number(m.abono)?money(m.abono):"")+'</td>'
          +'<td class="num">'+money(m._saldo)+'</td></tr>';
      });
      if(hayMas) filas+='<tr><td></td><td style="text-align:left"><b>◂ Saldo anterior</b></td><td></td><td></td><td class="num"><b>'+money(saldoAnterior)+'</b></td></tr>';
      h+='<div class="card"><div class="tblwrap"><table><thead><tr><th>Fecha</th><th>Detalle</th><th>Cargo</th><th>Abono</th><th>Saldo</th></tr></thead><tbody>'+filas+'</tbody></table></div></div>';
      h+='<p class="updated">Toca una venta (🧾) para ver, descargar o compartir su factura'+(hayMas?' · mostrando los últimos '+MOVS_RAPIDO:'')+'</p>';
      if(hayMas) h+='<div style="text-align:center;margin-top:10px"><button class="xls" id="verTodo">Ver todo el historial</button></div>';
      host.innerHTML=h; el("volver2").onclick=volver;
      if(hayMas) el("verTodo").onclick=function(){ verCliente(c, true); };
      Array.prototype.forEach.call(host.querySelectorAll("tr.vta"), function(tr){ tr.onclick=function(){ abrirFactura(Number(tr.dataset.v), null); }; });
      state.cache.cliente={c:c, movs:movs, saldoAnterior: hayMas?saldoAnterior:null};
    });
  }

  // ===== FACTURA: ver / descargar / compartir (igual al tiquete POS del programa) =====
  // Sale del estado de cuenta (cliente_movimiento, agrupado por venta_id: trae N° de factura, título
  // y el saldo) o de Transacciones (últimos 7 días, también ventas de contado, sin saldo).
  function ventaDeRef(ref){ var m=/^Venta-(\d+)-/.exec(String(ref||"")); return m?Number(m[1]):null; }
  function cargarEmpresa(){
    var k="empresa_"+state.negocioId;
    if(state.cache[k]) return Promise.resolve(state.cache[k]);
    var neg=(state.negocios||[]).filter(function(n){ return n.id===state.negocioId; })[0];
    return base("empresa_info").maybeSingle().then(function(r){
      var e=(r && !r.error && r.data) ? r.data : {};
      if(!e.nombre) e.nombre = neg ? neg.nombre : "";
      state.cache[k]=e; return e;
    }, function(){ return { nombre: neg?neg.nombre:"" }; });
  }
  function abrirFactura(ventaId, filasTrans){
    var ov=document.createElement("div"); ov.className="fac-ov"; ov.setAttribute("role","dialog");
    ov.innerHTML='<div class="fac-msg">Armando la factura…</div>';
    document.body.appendChild(ov);
    function teclas(e){ if(e.key==="Escape") cerrar(); }
    function cerrar(){ ov.remove(); document.removeEventListener("keydown", teclas); }
    document.addEventListener("keydown", teclas);
    ov.addEventListener("click", function(e){ if(e.target===ov) cerrar(); });
    var neg=state.negocioId;
    Promise.all([
      cargarEmpresa(),
      sb.from("cliente_movimiento").select("cliente_id,fecha,producto,kilos,precio,cargo,factura,titulo")
        .eq("negocio_id", neg).eq("venta_id", ventaId)
    ]).then(function(r){
      var emp=r[0], lin=(r[1] && r[1].data) || [];
      if(lin.length){
        var f0=lin[0];
        var fac={ ventaId:ventaId, num: f0.factura ? "FACTURA DE VENTA #"+f0.factura : "COMPROBANTE DE VENTA #"+ventaId,
          titulo:f0.titulo||"", fecha:new Date(f0.fecha), pago:"Crédito", cliente:"",
          lineas: lin.map(function(l){ return { producto:l.producto||"", kilos:Number(l.kilos||0), precio:l.precio||"", valor:Number(l.cargo||0) }; }) };
        fac.total=fac.lineas.reduce(function(s,l){ return s+l.valor; },0);
        // Saldo: el actual del cliente menos lo que pasó DESPUÉS de esta venta = saldo justo tras ella.
        return Promise.all([
          base("cartera").eq("cliente_id", f0.cliente_id).maybeSingle(),
          sb.from("cliente_movimiento").select("cargo,abono").eq("negocio_id", neg).eq("cliente_id", f0.cliente_id).gt("fecha", f0.fecha)
        ]).then(function(r2){
          var car=r2[0] && r2[0].data;
          if(car){
            fac.cliente=car.nombre;
            var post=(r2[1].data||[]).reduce(function(s,m){ return s+Number(m.cargo)-Number(m.abono); },0);
            var despues=Number(car.saldo||0)-post;
            fac.saldo={ antes: despues-fac.total, despues: despues };
          }
          return [fac, emp];
        });
      }
      if(filasTrans && filasTrans.length){
        var t0=filasTrans[0];
        var tit=""; var p=String(t0.detalle||"").indexOf(" · 📝 "); if(p>=0) tit=String(t0.detalle).slice(p+5).trim();
        var fac2={ ventaId:ventaId, num:"COMPROBANTE DE VENTA #"+ventaId, titulo:tit, fecha:new Date(t0.momento||t0.fecha),
          pago:t0.pago||"", cliente:t0.cliente||"CONTADO",
          lineas: filasTrans.map(function(x){ return { producto:x.producto||"", kilos:Number(x.kilos||0), precio:x.precio||"", valor:Number(x.valor||0) }; }) };
        fac2.total=fac2.lineas.reduce(function(s,l){ return s+l.valor; },0);
        return [fac2, emp];
      }
      return [null, emp];
    }).then(function(par){
      if(!document.body.contains(ov)) return;
      if(!par[0]){ ov.innerHTML='<div class="fac-msg">No encontré esa venta en la nube.<br><br><button class="xls" id="facX">Cerrar</button></div>'; el("facX").onclick=cerrar; return; }
      mostrarFactura(ov, par[0], par[1], cerrar);
    }).catch(function(e){
      ov.innerHTML='<div class="fac-msg">No se pudo armar la factura: '+esc(e && e.message || e)+'<br><br><button class="xls" id="facX">Cerrar</button></div>'; el("facX").onclick=cerrar;
    });
  }
  function mostrarFactura(ov, fac, emp, cerrar){
    // Arranca como esté en Configuración del programa (con saldo, salvo que el dueño diga lo contrario).
    var conSaldo = !!fac.saldo && emp.con_saldo !== false;
    var actual=null;
    function pintar(){
      dibujarFactura(fac, emp, conSaldo).then(function(cv){
        actual=cv;
        var puedeCompartir = !!(navigator.share && navigator.canShare);
        ov.innerHTML='<div class="fac-bar">'
          +(fac.saldo?'<button class="tog'+(conSaldo?' on':'')+'" id="facCon">Con saldo</button><button class="tog'+(!conSaldo?' on':'')+'" id="facSin">Sin saldo</button>':'')
          +'</div><div class="fac-bar">'
          +(puedeCompartir?'<button class="prim" id="facShare">📤 Compartir</button>':'')
          +'<button class="'+(puedeCompartir?'sec2':'prim')+'" id="facDown">⬇️ Descargar</button>'
          +'<button class="sec2" id="facClose">✕ Cerrar</button></div>'
          +'<img class="fac-img" alt="Factura" src="'+cv.toDataURL("image/png")+'">';
        el("facClose").onclick=cerrar;
        if(fac.saldo){ el("facCon").onclick=function(){ conSaldo=true; pintar(); }; el("facSin").onclick=function(){ conSaldo=false; pintar(); }; }
        el("facDown").onclick=function(){
          var a=document.createElement("a"); a.href=actual.toDataURL("image/png"); a.download=nombreArchivoFactura(fac);
          document.body.appendChild(a); a.click(); a.remove();
        };
        if(puedeCompartir) el("facShare").onclick=function(){
          actual.toBlob(function(b){
            var file=new File([b], nombreArchivoFactura(fac), {type:"image/png"});
            if(!navigator.canShare({files:[file]})){ el("facDown").click(); return; }
            navigator.share({ files:[file], title: fac.num }).catch(function(){});
          }, "image/png");
        };
      });
    }
    pintar();
  }
  function nombreArchivoFactura(fac){
    return ("Factura-"+fac.ventaId+"-"+(fac.cliente||"cliente")).replace(/[^\w\-]+/g,"_")+".png";
  }
  // Dibuja el tiquete en un canvas (576 px = el ancho de un POS de 80 mm al doble de resolución).
  function dibujarFactura(fac, emp, conSaldo){
    var W=576, M=22, MONO='ui-monospace,Menlo,Consolas,"Roboto Mono","Courier New",monospace', SANS='Arial,Helvetica,sans-serif';
    var cv=document.createElement("canvas"); cv.width=W; cv.height=5000;
    var g=cv.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,W,cv.height); g.fillStyle="#000"; g.strokeStyle="#000"; g.textBaseline="top";
    var y=18;
    function f(px,bold,mono){ g.font=(bold?"bold ":"")+px+"px "+(mono?MONO:SANS); }
    function ancho(t){ return g.measureText(t).width; }
    function centro(t,px,bold){ f(px,bold); while(px>14 && ancho(t)>W-2*M){ px--; f(px,bold); } g.textAlign="center"; g.fillText(t,W/2,y); y+=Math.round(px*1.3); }
    // Título largo: una línea si cabe; si no, en dos por el espacio más cercano a la mitad.
    function titulo(t,px){
      f(px,true); if(ancho(t)<=W-2*M){ centro(t,px,true); return; }
      var c=-1; for(var i=0;i<t.length;i++) if(t[i]===" " && (c<0 || Math.abs(i-t.length/2)<Math.abs(c-t.length/2))) c=i;
      if(c<0){ centro(t,px,true); return; }
      var a=t.slice(0,c), b=t.slice(c+1); while(px>16 && (ancho(a)>W-2*M || ancho(b)>W-2*M)){ px--; f(px,true); }
      centro(a,px,true); centro(b,px,true);
    }
    function dos(a,b,px,bold){ f(px,bold,true); g.textAlign="left"; g.fillText(a,M,y); g.textAlign="right"; g.fillText(b,W-M,y); y+=Math.round(px*1.35); }
    function sep(){ y+=4; g.fillRect(M,y,W-2*M,2); y+=12; }
    function recortar(t,max){ if(ancho(t)<=max) return t; while(t.length>1 && ancho(t+"…")>max) t=t.slice(0,-1); return t+"…"; }
    function cuerpo(logo){
      if(logo){ var lw=Math.min(300, logo.width), lh=logo.height*lw/logo.width; if(lh>190){ lh=190; lw=logo.width*lh/logo.height; }
        g.drawImage(logo,(W-lw)/2,y,lw,lh); y+=lh+10; }
      if(emp.nombre) centro(emp.nombre,40,true);
      if(emp.nit) centro("NIT/CC: "+emp.nit,24,false);
      if(emp.direccion) centro(emp.direccion,24,false);
      if(emp.telefono) centro("Tel: "+emp.telefono,24,false);
      sep();
      centro(fac.num,30,true);
      if(fac.titulo) titulo(String(fac.titulo).toUpperCase(),36);
      sep();
      var fe=fac.fecha.toLocaleDateString("es-CO",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+fac.fecha.toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"});
      f(26,false,true); g.textAlign="left"; g.fillText("Fecha: "+fe,M,y); y+=34;

      });
      dos("Total: "+kg.toLocaleString("es-CO",{minimumFractionDigits:2,maximumFractionDigits:2})+" kg","Items: "+fac.lineas.length,24,false);

      f(56,true); g.fillText(money(fac.total),W/2,y); y+=70;
      g.lineWidth=3; g.strokeRect(M,bx,W-2*M,y-bx); y+=16;
      f(24,false,true); g.textAlign="left";
      g.fillText("Pago: "+(fac.pago==="Contado"?"CONTADO":"CRÉDITO (queda en cartera)"),M,y); y+=34;

    return new Promise(function(ok){

      var im=new Image(); im.onload=function(){ ok(cuerpo(im)); }; im.onerror=function(){ ok(cuerpo(null)); };

  // ===== 📥 INGRESO DE MERCANCÍA DESDE EL CELULAR (factura del proveedor) =====
  // Queda en solicitud_movil ya aprobado; el computador lo aplica en su siguiente sincronización
  // (≤ 3 min, si está prendido) igual que el Ingreso rápido: inventario + cuenta del proveedor o caja.
  function cargarCatalogo(){
    var k="cat_"+state.negocioId;
    if(state.cache[k]) return Promise.resolve(state.cache[k]);
    return base("catalogo_movil").then(function(r){
      var c={producto:[],proveedor:[],viaje:[]};
      ((r&&r.data)||[]).forEach(function(x){ (c[x.tipo]||(c[x.tipo]=[])).push(x); });
      Object.keys(c).forEach(function(t){ c[t].sort(function(a,b){ return String(a.nombre).localeCompare(String(b.nombre),"es"); }); });
      state.cache[k]=c; return c;
    });
  }
  function valorArroba(kg,precio){ return Number(kg||0)*Number(precio||0)*1000/12.5; }
  function pillSolicitud(s){
    if(s.estado==="aplicada") return '<span class="pill good">✅ Aplicado</span>';
    if(s.estado==="error") return '<span class="pill bad">❌ Error</span>';
    if(s.estado==="rechazada") return '<span class="pill bad">❌ Rechazada</span>';
    if(s.estado==="pendiente") return '<span class="pill warn">⏳ Esperando decisión</span>';
    return '<span class="pill info">⏳ Esperando al computador</span>';
  }
  function loadIngreso(){
    var host=sec("ingreso"); host.innerHTML='<div class="loading">Cargando…</div>';
    Promise.all([
      cargarCatalogo(),
      sb.from("solicitud_movil").select("id,creado,resumen,estado,error").eq("negocio_id", state.negocioId).eq("tipo","ingreso").order("id",{ascending:false}).limit(15)
    ]).then(function(r){
      if(state.section!=="ingreso") return;
      pintarIngreso(r[0], (r[1]&&r[1].data)||[]);
    });
  }
  function pintarIngreso(cat, enviados){
    var host=sec("ingreso");
    if(!cat.producto.length){
      host.innerHTML='<div class="sechead"><h2 class="sec">Ingreso de mercancía</h2></div><div class="empty">Todavía no hay productos en la nube. Abre el programa en el computador (con la versión nueva) y espera unos minutos.</div>';
      return;
    }
    var opt=function(arr,sel){ return arr.map(function(x){ return '<option value="'+x.id+'"'+(sel(x)?' selected':'')+'>'+esc(x.nombre)+'</option>'; }).join(""); };

      +'<div id="iProvNuevoBox" hidden><label for="iProvNombre">Nombre del proveedor nuevo</label><input id="iProvNombre" maxlength="80" placeholder="Ej: PESCADOS DEL META">'

      +'<label for="iViaje">Viaje donde entra la mercancía</label><select id="iViaje"><option value="__nuevo">➕ Viaje nuevo…</option>'+opt(cat.viaje,function(x){ return x.extra && x.extra.predeterminado; })+'</select>'
      +'<div id="iViajeNuevoBox" hidden><label for="iViajeRef">Nombre del viaje nuevo</label><input id="iViajeRef" maxlength="60">'
      +'<label>Tipo de viaje</label><div class="formas">'
      +'<label><input type="radio" name="iTipoViaje" value="COMPRA" checked> Normal (compra: la mercancía es mía)</label>'
      +'<label><input type="radio" name="iTipoViaje" value="COMISION"> Comisión (vendo por cuenta del proveedor)</label></div></div>'
      +'<label>Productos (kilos · precio de compra en miles por arroba)</label><div id="iLineas"></div>'
      +'<datalist id="dlProd">'+cat.producto.map(function(p){ return '<option value="'+esc(p.nombre)+'">'+esc((p.extra&&p.extra.codigo)||"")+'</option>'; }).join("")+'</datalist>'
      +'<button type="button" class="addl" id="iAdd">➕ Otro producto</button>'
      +'<div id="iFormaBox"><label>¿Cómo se paga?</label><div class="formas">'
      +'<label><input type="radio" name="iForma" value="credito" checked> A crédito (le quedo debiendo)</label>'
      +'<label><input type="radio" name="iForma" value="contado"> De contado, sale de la caja <select id="iCaja" style="width:auto;padding:5px 8px;margin-left:auto">'+CAJAS.map(function(c){ return '<option value="'+c[0]+'">'+c[2]+'</option>'; }).join("")+'</select></label>'
      +'<label><input type="radio" name="iForma" value="fuera"> Ya pagado por fuera de la caja</label>'
      +'</div></div>'

      +'<div class="total-row" style="margin:14px -14px -14px"><span>Total de la factura</span><span class="big num" id="iTotal">$0</span></div>'
      +'</div></div>'
      +'<button class="btn" id="iEnviar" style="margin-top:12px">📨 Enviar al sistema</button>'
      +'<p class="updated">El computador lo registra solo en unos minutos (tiene que estar prendido y con internet). Sube el inventario y la cuenta del proveedor, o sale de la caja y va al cierre.</p>';
    h+='<div class="sechead" style="margin-top:18px"><h2 class="sec">Últimos enviados</h2></div>';
    h+= enviados.length ? '<div class="card">'+enviados.map(function(s){
        return '<div class="solc"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="m">'+new Date(s.creado).toLocaleString("es-CO",{day:"2-digit",month:"short",hour:"numeric",minute:"2-digit"})+'</span>'+pillSolicitud(s)+'</div>'
          +'<div class="r">'+esc(s.resumen)+'</div>'+(s.error?'<div class="m" style="color:var(--bad)">'+esc(s.error)+'</div>':'')+'</div>';
      }).join("")+'</div>' : '<div class="empty">Aún no has enviado ingresos desde el celular.</div>';
    host.innerHTML=h;

    var lineas=el("iLineas");
    function porNombre(t){ t=String(t||"").trim().toLowerCase(); if(!t) return null;
      return cat.producto.filter(function(p){ return String(p.nombre).toLowerCase()===t || String((p.extra&&p.extra.codigo)||"").toLowerCase()===t; })[0] || null; }
    function total(){
      var tot=0;
      Array.prototype.forEach.call(lineas.querySelectorAll(".ilin"), function(row){
        var v=valorArroba(row.querySelector(".k").value, row.querySelector(".p").value); tot+=v;
        var p=porNombre(row.querySelector(".n").value);
        row.querySelector(".sub").textContent = (row.querySelector(".n").value && !p ? "⚠️ No encuentro ese producto · " : "") + (v?money(v):"");
      });
      el("iTotal").textContent=money(tot);
    }
    function agregar(){
      var row=document.createElement("div"); row.className="ilin";
      row.innerHTML='<input class="n" list="dlProd" placeholder="Producto" autocomplete="off"><input class="k" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Kilos"><input class="p" type="number" inputmode="decimal" min="0" step="0.1" placeholder="Precio"><button type="button" class="x" aria-label="Quitar">✕</button><div class="sub"></div>';
      row.querySelector(".n").addEventListener("change", function(){
        var p=porNombre(this.value), pr=row.querySelector(".p");
        if(p && !pr.value && p.extra && Number(p.extra.precio_compra)) pr.value=p.extra.precio_compra;
        total();
      });
      row.querySelector(".k").addEventListener("input", total);
      row.querySelector(".p").addEventListener("input", total);
      row.querySelector(".x").addEventListener("click", function(){ if(lineas.children.length>1){ row.remove(); total(); } });
      lineas.appendChild(row);
    }
    agregar();
    el("iAdd").onclick=agregar;
    var prov=el("iProv"), viajeSel=el("iViaje");
    el("iViajeRef").value="VIAJE "+new Date().toLocaleDateString("es-CO",{day:"2-digit",month:"2-digit"});
    // ¿El viaje elegido (o el nuevo) es de COMISIÓN? Ahí no se paga ni se carga a la cuenta: no se pregunta cómo se paga.
    function esComision(){
      if(viajeSel.value==="__nuevo") return ((document.querySelector('input[name="iTipoViaje"]:checked')||{}).value)==="COMISION";
      var v=cat.viaje.filter(function(x){ return String(x.id)===viajeSel.value; })[0];
      return !!(v && v.extra && /^COMISI/i.test(String(v.extra.tipo_viaje||"")));
    }
    function verForma(){
      el("iProvNuevoBox").hidden = prov.value!=="__nuevo";
      el("iViajeNuevoBox").hidden = viajeSel.value!=="__nuevo";
      el("iFormaBox").hidden = !prov.value || esComision();
    }
    prov.onchange=verForma; viajeSel.onchange=verForma;
    Array.prototype.forEach.call(document.querySelectorAll('input[name="iTipoViaje"]'), function(r){ r.onchange=verForma; });
    verForma();

    el("iEnviar").onclick=function(){
      var btn=this, items=[], resumenL=[], tot=0, malo=null;
      Array.prototype.forEach.call(lineas.querySelectorAll(".ilin"), function(row){
        var nom=row.querySelector(".n").value, k=Number(row.querySelector(".k").value||0), pr=Number(row.querySelector(".p").value||0);
        if(!nom && !k) return;
        var p=porNombre(nom);
        if(!p){ malo="No encuentro el producto \""+nom+"\". Elígelo de la lista."; return; }
        if(!(k>0)){ malo="Falta los kilos de "+p.nombre+"."; return; }
        items.push({producto_id:p.id, nombre:p.nombre, kilos:k, precio:pr});
        tot+=valorArroba(k,pr);
        resumenL.push(p.nombre+" "+kilos(k)+" kg @"+pr);
      });
      if(malo){ say(malo); return; }
      if(!items.length){ say("Agrega al menos un producto con kilos."); return; }
      var viaje=el("iViaje").value; if(!viaje){ say("Elige el viaje."); return; }
      var provNuevo = prov.value==="__nuevo", viajeNuevo = viaje==="__nuevo", comi = esComision();
      var provNombreNuevo = el("iProvNombre").value.trim().toUpperCase();
      if(provNuevo && !provNombreNuevo){ say("Escribe el nombre del proveedor nuevo."); el("iProvNombre").focus(); return; }
      if(provNuevo && cat.proveedor.some(function(p){ return String(p.nombre).toUpperCase()===provNombreNuevo; })){ say("Ese proveedor ya existe: elígelo de la lista."); return; }
      var viajeRefNuevo = el("iViajeRef").value.trim();
      if(viajeNuevo && !viajeRefNuevo){ say("Escribe el nombre del viaje nuevo."); el("iViajeRef").focus(); return; }
      if(comi && !prov.value){ say("Un viaje de comisión necesita el proveedor (dueño de la mercancía)."); return; }
      var forma = prov.value && !comi ? (document.querySelector('input[name="iForma"]:checked')||{}).value : "";
      var caja = forma==="contado" ? el("iCaja").value : "";
      var provNom = provNuevo ? provNombreNuevo+" (nuevo)" : prov.value ? prov.options[prov.selectedIndex].text : "";
      var viajeNom = viajeNuevo ? viajeRefNuevo+(comi?" (nuevo, comisión)":" (nuevo)") : el("iViaje").options[el("iViaje").selectedIndex].text;
      var formaTxt = comi ? "viaje de comisión (sin cargo a la cuenta)" : !prov.value ? "solo inventario" : forma==="credito" ? "a crédito" : forma==="contado" ? "de contado ("+nombreCaja(caja)+")" : "pagado por fuera de caja";
      var resumen = "Ingreso"+(provNom?" de "+provNom:"")+": "+resumenL.join(" + ")+" = "+money(tot)+" · "+formaTxt+" · viaje "+viajeNom+(el("iNota").value?" · "+el("iNota").value:"");
      if(!confirm("¿Enviar este ingreso al sistema?\n\n"+resumen)) return;
      btn.disabled=true; btn.textContent="Enviando…";
      sb.auth.getSession().then(function(ss){
        var email=(ss.data&&ss.data.session&&ss.data.session.user&&ss.data.session.user.email)||"";
        return sb.from("solicitud_movil").insert({
          negocio_id:state.negocioId, origen:"celular", tipo:"ingreso", estado:"aprobada", creado_por:email, resumen:resumen,
          datos:{
            viaje_id: viajeNuevo ? null : Number(viaje),
            viaje_nuevo: viajeNuevo ? { referencia:viajeRefNuevo, tipo: comi ? "COMISION" : "COMPRA" } : null,
            proveedor_id: prov.value && !provNuevo ? Number(prov.value) : null,
            proveedor_nuevo: provNuevo ? { nombre:provNombreNuevo, telefono:el("iProvTel").value.trim() } : null,
            forma:forma||"", caja:caja, lineas:items, nota:el("iNota").value||"" }
        });
      }).then(function(res){
        btn.disabled=false; btn.textContent="📨 Enviar al sistema";
        if(res.error){ say("No se pudo enviar: "+res.error.message); return; }
        say("📨 Enviado. El computador lo registra en unos minutos.");
        // El proveedor/viaje nuevo aparecerá en las listas cuando el computador lo cree y sincronice.
        delete state.cache["cat_"+state.negocioId];
        loadIngreso();
      });
    };
  }

  // ===== 👤 USUARIOS: crear usuarios y cambiar rol / contraseña / permisos desde el celular =====
  // Igual que el ingreso: queda en solicitud_movil (tipo 'usuario', ya aprobada) y el computador lo
  // aplica en su siguiente sincronización. La contraseña no viaja: se manda su huella SHA-256 (la
  // misma que guarda el programa) y la nube la borra apenas el computador la usa.
  function esDueno(){ var n=(state.negocios||[]).filter(function(x){ return x.id===state.negocioId; })[0]; return !n || !n.rol || n.rol==="dueno"; }
  function sha256Hex(txt){
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
    });
  }
  function loadUsuarios(){
    var host=sec("usuarios"); host.innerHTML='<div class="loading">Cargando…</div>';
    delete state.cache["cat_"+state.negocioId];   // siempre fresco: lo que cambió el computador
    Promise.all([
      cargarCatalogo(),
      sb.from("solicitud_movil").select("id,creado,resumen,estado,error,datos").eq("negocio_id", state.negocioId).eq("tipo","usuario").order("id",{ascending:false}).limit(15)
    ]).then(function(r){
      if(state.section!=="usuarios") return;
      pintarUsuarios(r[0], (r[1]&&r[1].data)||[]);
    });
  }
  function pintarUsuarios(cat, enviados){
    var host=sec("usuarios"), usuarios=cat.usuario||[], roles=cat.rol||[];
    if(!(cat.modulo||[]).length){
      host.innerHTML='<div class="sechead"><h2 class="sec">Usuarios</h2></div><div class="empty">Para manejar los usuarios desde aquí, el programa del computador tiene que estar actualizado a la versión nueva. Ábrelo y espera unos minutos.</div>';
      return;
    }
    // Usuarios con un cambio enviado que el computador aún no aplica.
    var enCamino={};
    enviados.forEach(function(s){ if(s.estado==="aprobada" && s.datos && Number(s.datos.usuario_id)>0) enCamino[String(s.datos.usuario_id)]=true; });
    var h='<div class="sechead"><h2 class="sec">Usuarios del programa</h2></div>';
    if(!esDueno()) h+='<div class="empty" style="padding:12px">Solo la cuenta del dueño puede crear o cambiar usuarios.</div>';
    h+='<div class="card">'+usuarios.map(function(u){
      var x=u.extra||{}, perms=(x.permisos||[]).filter(function(p){ return p.ver; }).length;
      var camino=enCamino[String(u.id)];
      return '<div class="usr" data-u="'+u.id+'"><div><div class="n">'+esc(u.nombre||x.usuario)+'</div><div class="m">@'+esc(x.usuario||"")+' · '+(x.es_admin?'puede todo':perms+' módulo'+(perms===1?'':'s'))+'</div></div>'
        +'<div class="p"><span class="pill info">'+esc(x.rol||"")+'</span>'+(x.activo?'':'<span class="pill bad">Inactivo</span>')+(camino?'<span class="pill warn">⏳ Cambio en camino</span>':'')+'</div></div>';
    }).join("")+'</div>';
    if(esDueno()) h+='<button class="btn" id="uNuevo" style="margin-top:12px">➕ Usuario nuevo</button>';
    h+='<p class="updated">Los cambios los aplica el computador en unos minutos (tiene que estar prendido y con internet). Si el usuario tiene la sesión abierta, sus permisos nuevos cuentan al volver a entrar.</p>';
    h+='<div class="sechead" style="margin-top:18px"><h2 class="sec">Últimos cambios enviados</h2></div>';
    h+= enviados.length ? '<div class="card">'+enviados.map(function(s){
        return '<div class="solc"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="m">'+new Date(s.creado).toLocaleString("es-CO",{day:"2-digit",month:"short",hour:"numeric",minute:"2-digit"})+'</span>'+pillSolicitud(s)+'</div>'
          +'<div class="r">'+esc(s.resumen)+'</div>'+(s.error?'<div class="m" style="color:var(--bad)">'+esc(s.error)+'</div>':'')+'</div>';
      }).join("")+'</div>' : '<div class="empty">Aún no has enviado cambios de usuarios desde el celular.</div>';
    host.innerHTML=h;
    if(el("uNuevo")) el("uNuevo").onclick=function(){ editarUsuario(cat, null); };
    Array.prototype.forEach.call(host.querySelectorAll(".usr"), function(row){
      row.onclick=function(){
        var u=usuarios.filter(function(x){ return String(x.id)===row.getAttribute("data-u"); })[0];
        if(!u) return;
        if((u.extra||{}).es_admin){ say("El usuario Admin principal solo se cambia desde el computador."); return; }
        if(!esDueno()){ say("Solo la cuenta del dueño puede cambiar usuarios."); return; }
        editarUsuario(cat, u);
      };
    });
  }
  function editarUsuario(cat, u){
    var host=sec("usuarios"), x=(u&&u.extra)||{}, nuevo=!u;
    var roles=(cat.rol||[]).filter(function(r){ return !(r.extra&&r.extra.es_admin); });
    var modulos=(cat.modulo||[]).slice().sort(function(a,b){ return a.id-b.id; });
    var permisos={};   // clave -> {ver,crear,editar,eliminar}
    function cargar(lista){ permisos={}; (lista||[]).forEach(function(p){ permisos[p.modulo]={ver:!!p.ver,crear:!!p.crear,editar:!!p.editar,eliminar:!!p.eliminar}; }); }
    function plantilla(rolId){ var r=roles.filter(function(r){ return String(r.id)===String(rolId); })[0]; return (r&&r.extra&&r.extra.plantilla)||[]; }
    var rolIni = nuevo ? ((roles.filter(function(r){ return /cajer/i.test(r.nombre); })[0]||roles[0]||{}).id) : x.rol_id;
    cargar(nuevo ? plantilla(rolIni) : x.permisos);

    var h='<div class="sechead"><h2 class="sec">'+(nuevo?'Usuario nuevo':'Cambiar usuario @'+esc(x.usuario))+'</h2></div>';
    h+='<div class="card"><div class="form">'
      +'<label for="uLogin">Usuario (con el que entra al programa)</label><input id="uLogin" maxlength="40" autocomplete="off" autocapitalize="none" value="'+esc(x.usuario||"")+'">'
      +'<label for="uNombre">Nombre completo</label><input id="uNombre" maxlength="80" value="'+esc(u?u.nombre:"")+'">'
      +'<label for="uRol">Rol</label><select id="uRol">'+roles.map(function(r){ return '<option value="'+r.id+'"'+(String(r.id)===String(rolIni)?' selected':'')+'>'+esc(r.nombre)+'</option>'; }).join("")+'</select>'
      +'<label class="chk"><input type="checkbox" id="uActivo"'+(nuevo||x.activo?' checked':'')+'> Activo (puede entrar al programa)</label>'
      +'<label for="uPass">'+(nuevo?'Contraseña':'Contraseña nueva (déjala vacía para no cambiarla)')+'</label><input id="uPass" type="password" maxlength="60" autocomplete="new-password">'
      +'<label for="uPass2">Repetir la contraseña</label><input id="uPass2" type="password" maxlength="60" autocomplete="new-password">'
      +'<label class="chk"><input type="checkbox" data-ver="uPass,uPass2"> Mostrar contraseñas</label>'
      +'</div></div>';
    h+='<div class="sechead" style="margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 class="sec">Permisos</h2><button type="button" class="btn2" id="uPlantilla">↺ Los del rol</button></div>';
    h+='<div class="card" style="padding:4px 12px 10px"><table class="perm"><thead><tr><th>Módulo</th><th>Ver</th><th>Crear</th><th>Editar</th><th>Borrar</th></tr></thead><tbody id="uPerm"></tbody></table></div>';
    h+='<button class="btn" id="uGuardar" style="margin-top:12px">📨 Enviar al sistema</button>';
    h+='<button class="btn2" id="uVolver" style="margin-top:10px;width:100%">← Volver a la lista</button>';
    host.innerHTML=h; window.scrollTo(0,0);

    function pintarPermisos(){
      var filas="", secc="";
      modulos.forEach(function(m){
        var e=m.extra||{}, p=permisos[e.clave]||{};
        if(e.seccion!==secc){ secc=e.seccion; filas+='<tr class="secc"><td colspan="5">'+esc(secc)+'</td></tr>'; }
        filas+='<tr><td>'+esc(m.nombre)+'</td>'+["ver","crear","editar","eliminar"].map(function(k){
          return '<td><input type="checkbox" data-m="'+esc(e.clave)+'" data-k="'+k+'"'+(p[k]?' checked':'')+' aria-label="'+esc(m.nombre)+' '+k+'"></td>'; }).join("")+'</tr>';
      });
      el("uPerm").innerHTML=filas;
      Array.prototype.forEach.call(el("uPerm").querySelectorAll("input"), function(c){
        c.onchange=function(){
          var m=c.getAttribute("data-m"), k=c.getAttribute("data-k"), p=permisos[m]||(permisos[m]={ver:false,crear:false,editar:false,eliminar:false});
          p[k]=c.checked;
          if(k!=="ver" && c.checked) p.ver=true;                                 // sin "ver" lo demás no sirve
          if(k==="ver" && !c.checked){ p.crear=p.editar=p.eliminar=false; }
          pintarPermisos();
        };
      });
    }
    pintarPermisos();
    el("uRol").onchange=function(){ if(nuevo){ cargar(plantilla(this.value)); pintarPermisos(); } };
    el("uPlantilla").onclick=function(){
      if(!confirm("¿Poner los permisos por defecto del rol "+el("uRol").options[el("uRol").selectedIndex].text+"?")) return;
      cargar(plantilla(el("uRol").value)); pintarPermisos();
    };
    el("uVolver").onclick=function(){ loadUsuarios(); };
    el("uGuardar").onclick=function(){
      var btn=this, login=el("uLogin").value.trim(), nombre=el("uNombre").value.trim(), rolId=Number(el("uRol").value),
          activo=el("uActivo").checked, p1=el("uPass").value, p2=el("uPass2").value;
      if(!login){ say("Escribe el usuario con el que entra."); el("uLogin").focus(); return; }
      if(!nombre){ say("Escribe el nombre completo."); el("uNombre").focus(); return; }
      if(!rolId){ say("Elige el rol."); return; }
      if((cat.usuario||[]).some(function(o){ return (!u || o.id!==u.id) && String((o.extra||{}).usuario||"").toLowerCase()===login.toLowerCase(); })){ say("Ya existe otro usuario '"+login+"'."); return; }
      if(nuevo && !p1){ say("Un usuario nuevo necesita contraseña."); el("uPass").focus(); return; }
      if(p1 && p1.length<4){ say("La contraseña debe tener al menos 4 caracteres."); el("uPass").focus(); return; }
      if(p1!==p2){ say("Las contraseñas no coinciden."); el("uPass2").focus(); return; }
      var lista=Object.keys(permisos).filter(function(k){ var p=permisos[k]; return p.ver||p.crear||p.editar||p.eliminar; })
        .map(function(k){ var p=permisos[k]; return {modulo:k, ver:true, crear:!!p.crear, editar:!!p.editar, eliminar:!!p.eliminar}; });
      var rolNom=el("uRol").options[el("uRol").selectedIndex].text;
      var cambios=[];
      if(nuevo) cambios.push("rol "+rolNom, lista.length+" módulo"+(lista.length===1?"":"s"));
      else {
        if(login!==x.usuario) cambios.push("usuario @"+x.usuario+" → @"+login);
        if(nombre!==u.nombre) cambios.push("nombre "+nombre);
        if(String(rolId)!==String(x.rol_id)) cambios.push("rol "+(x.rol||"")+" → "+rolNom);
        if(activo!==!!x.activo) cambios.push(activo?"activado":"DESACTIVADO");
        if(p1) cambios.push("contraseña nueva");
        var antes=JSON.stringify((x.permisos||[]).map(function(p){ return [p.modulo,!!p.ver,!!p.crear,!!p.editar,!!p.eliminar]; }).sort());
        var ahora=JSON.stringify(lista.map(function(p){ return [p.modulo,p.ver,p.crear,p.editar,p.eliminar]; }).sort());
        if(antes!==ahora) cambios.push("permisos ("+lista.length+" módulo"+(lista.length===1?"":"s")+")");
        if(!cambios.length){ say("No cambiaste nada."); return; }
      }
      var resumen=(nuevo?"Usuario nuevo @"+login+" ("+nombre+")":"Usuario @"+(x.usuario||login))+": "+cambios.join(" · ");
      if(!confirm("¿Enviar este cambio al sistema?\n\n"+resumen)) return;
      btn.disabled=true; btn.textContent="Enviando…";
      (p1 ? sha256Hex(p1) : Promise.resolve("")).then(function(hash){
        return sb.auth.getSession().then(function(ss){
          var email=(ss.data&&ss.data.session&&ss.data.session.user&&ss.data.session.user.email)||"";
          var datos={ usuario_id: nuevo?0:u.id, usuario:login, nombre:nombre, rol_id:rolId, activo:activo, permisos:lista };
          if(hash) datos.password_hash=hash;
          return sb.from("solicitud_movil").insert({ negocio_id:state.negocioId, origen:"celular", tipo:"usuario", estado:"aprobada", creado_por:email, resumen:resumen, datos:datos });
        });
      }).then(function(res){
        btn.disabled=false; btn.textContent="📨 Enviar al sistema";
        if(res.error){ say(/row-level|policy/i.test(res.error.message) ? "Solo la cuenta del dueño puede cambiar usuarios (o falta actualizar la base de la nube)." : "No se pudo enviar: "+res.error.message); return; }
        say("📨 Enviado. El computador lo aplica en unos minutos.");
        loadUsuarios();
      });
    };
  }

  // ===== 🛡️ CAMBIOS: solicitudes del cajero (aprobar/rechazar) + registro de cambios del programa =====
  state.audFiltro="Todo";
  function tipoSolicitud(t){ return t==="anular_venta"?"🚫 Anular venta": t==="editar_venta"?"✏️ Corregir venta": t==="ingreso"?"📥 Ingreso de mercancía": t==="usuario"?"👤 Usuario": t; }
  var CLASE_COLOR={ Anulaciones:"k-anul", Ediciones:"k-edic", Ingresos:"k-ing", Solicitudes:"k-sol", Otros:"k-otro" };
  function colorTipoSolicitud(t){ return t==="anular_venta"?"k-anul": t==="editar_venta"?"k-edic": t==="ingreso"?"k-ing":"k-otro"; }
  function claseAccion(a){ a=String(a||"");
    if(/SOLICITUD|APROBADO|RECHAZ/.test(a)) return "Solicitudes";
    if(/ANUL/.test(a)) return "Anulaciones";
    if(/EDIT|DESHACER|CORREG|QUITAR/.test(a)) return "Ediciones";
    if(/INGRESO/.test(a)) return "Ingresos";
    return "Otros"; }
  function loadCambios(){
    var host=sec("cambios"); host.innerHTML='<div class="loading">Cargando…</div>';
    var neg=state.negocioId, fecha=state.fecha;
    // Las PENDIENTES salen siempre (sean del día que sean); el historial y el registro, solo del día
    // elegido en la barra de fechas (‹ Hoy ›).
    var ini=new Date(fecha+"T00:00:00"), fin=new Date(ini.getTime()+86400000);
    Promise.all([
      sb.from("solicitud_movil").select("*").eq("negocio_id", neg).eq("estado","pendiente").order("id",{ascending:true}),
      sb.from("solicitud_movil").select("id,creado,tipo,resumen,estado,error,creado_por,decidido_por,origen").eq("negocio_id", neg).neq("estado","pendiente")
        .gte("creado", ini.toISOString()).lt("creado", fin.toISOString()).order("id",{ascending:false}).limit(100),
      base("auditoria_mov").eq("fecha", fecha).order("momento",{ascending:false}).limit(500)
    ]).then(function(r){
      if(state.section!=="cambios" || state.fecha!==fecha) return;
      state.cache.aud=(r[2]&&r[2].data)||[];
      pintarCambios((r[0]&&r[0].data)||[], (r[1]&&r[1].data)||[]);
      pintarBadge(((r[0]&&r[0].data)||[]).length);
    });
  }
  function pintarCambios(pend, hist){
    var host=sec("cambios");
    var h='<div class="sechead"><h2 class="sec">Solicitudes por aprobar</h2></div>';
    h+= pend.length ? '<div class="card">'+pend.map(function(s){
        return '<div class="solc '+colorTipoSolicitud(s.tipo)+'"><div class="t">'+tipoSolicitud(s.tipo)+'</div>'
          +'<div class="r">'+esc(s.resumen)+'</div>'
          +'<div class="m">Pidió: '+esc(s.creado_por||"—")+' · '+new Date(s.creado).toLocaleString("es-CO",{day:"2-digit",month:"short",hour:"numeric",minute:"2-digit"})+'</div>'
          +'<div class="b"><button class="no" data-no="'+s.id+'">❌ Rechazar</button><button class="ok" data-si="'+s.id+'">✅ Aprobar</button></div></div>';
      }).join("")+'</div>'
      : '<div class="empty">No hay solicitudes esperando. Cuando un cajero sin permiso pida anular o corregir una venta, aparece aquí.</div>';
    h+='<div class="sechead" style="margin-top:18px"><h2 class="sec">Solicitudes del '+esc(dayLabel(state.fecha))+'</h2></div>';
    h+= hist.length ? '<div class="card">'+hist.map(function(s){
        return '<div class="solc '+colorTipoSolicitud(s.tipo)+'"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="t">'+tipoSolicitud(s.tipo)+'</span>'+pillSolicitud(s)+'</div>'
          +'<div class="r">'+esc(s.resumen)+'</div>'
          +'<div class="m">'+(s.origen==="pc"?'Pidió '+esc(s.creado_por||"—"):'Desde el celular: '+esc(s.creado_por||""))+(s.decidido_por?' · decidió '+esc(s.decidido_por):'')+' · '+new Date(s.creado).toLocaleString("es-CO",{day:"2-digit",month:"short",hour:"numeric",minute:"2-digit"})+'</div>'
          +(s.error?'<div class="m" style="color:var(--bad)">'+esc(s.error)+'</div>':'')+'</div>';
      }).join("")+'</div>' : '<div class="empty">Sin solicitudes este día.</div>';
    h+='<div class="sechead" style="margin-top:18px"><h2 class="sec">Registro de cambios del '+esc(dayLabel(state.fecha))+'</h2></div>';
    h+='<div class="tfil" id="audFil">'+["Todo","Anulaciones","Ediciones","Ingresos","Solicitudes","Otros"].map(function(t){ return '<button class="tchip '+(CLASE_COLOR[t]||'')+(state.audFiltro===t?' on':'')+'" data-af="'+t+'">'+t+'</button>'; }).join("")+'</div>';
    h+='<div id="audLista"></div>';
    host.innerHTML=h;

    Array.prototype.forEach.call(host.querySelectorAll("[data-no]"), function(b){ b.onclick=function(){ decidir(Number(b.dataset.no), false); }; });
    Array.prototype.forEach.call(host.querySelectorAll("[data-af]"), function(b){ b.onclick=function(){ state.audFiltro=b.dataset.af; pintarAuditoria(); Array.prototype.forEach.call(host.querySelectorAll("[data-af]"), function(x){ x.classList.toggle("on", x===b); }); }; });
    pintarAuditoria();
  }
  function pintarAuditoria(){
    var box=el("audLista"); if(!box) return;
    var rows=(state.cache.aud||[]).filter(function(a){ return state.audFiltro==="Todo" || claseAccion(a.accion)===state.audFiltro; });
    if(!rows.length){ box.innerHTML='<div class="empty">'+(state.audFiltro==="Todo"?"Sin cambios registrados este día.":"Nada de esto este día.")+'</div>'; return; }
    box.innerHTML='<div class="card">'+rows.slice(0,200).map(function(a){
      var acc=cap(String(a.accion||"").replace(/_/g," ").toLowerCase());
      var cambio=(a.antes?esc(a.antes):"")+(a.antes&&a.despues?" → ":"")+(a.despues?esc(a.despues):"");
      var cls=claseAccion(a.accion); return '<div class="audr '+CLASE_COLOR[cls]+'"><div style="display:flex;justify-content:space-between;gap:8px"><span class="a"><span class="ktag">'+({Anulaciones:"Anulación",Ediciones:"Edición",Ingresos:"Ingreso",Solicitudes:"Solicitud",Otros:"Otro"})[cls]+'</span>'+esc(acc)+(a.registro?' · '+esc(a.registro):'')+'</span>'
        +'<span class="m" style="white-space:nowrap">'+new Date(a.momento).toLocaleString("es-CO",{day:"2-digit",month:"short",hour:"numeric",minute:"2-digit"})+'</span></div>'
        +'<div class="d">'+(a.usuario?'👤 '+esc(a.usuario)+' · ':'')+esc(a.modulo)+(cambio?'<br>'+cambio:'')+'</div></div>';
    }).join("")+'</div>';
  }
  function decidir(id, aprobar){
    if(!confirm(aprobar ? "¿APROBAR? El computador lo hace solo en unos minutos." : "¿RECHAZAR esta solicitud? No se cambia nada.")) return;
    sb.rpc("decidir_solicitud", { p_id:id, p_aprobar:aprobar }).then(function(res){
      if(res.error){ say("No se pudo: "+res.error.message); return; }
      say(res.data==="ok" ? (aprobar?"✅ Aprobada. El computador la aplica en unos minutos.":"❌ Rechazada.") : String(res.data));
      loadCambios();
    });
  }

  var ultimoPendientes=0;

    var b=el("badgeCambios"); if(!b) return;

    // Franja visible arriba de TODAS las pantallas (la pestaña Cambios queda escondida al final de la

    var ban=el("bannerSol");

      ban.innerHTML = "🛡️ "+n+(n===1?" solicitud esperando":" solicitudes esperando")+" tu aprobación <b>· Ver ›</b>";
      ban.onclick=function(){ var c=document.querySelector('.chip[data-s="cambios"]'); if(c){ c.click(); try{ c.scrollIntoView({inline:"center", block:"nearest"}); }catch(e){} } };
    }
    if(pendientesAntes>=0 && n>pendientesAntes){
      if(tiposActivos().indexOf("__sol")<0) say("🛡️ Hay una solicitud de cambio esperando tu aprobación");

    }

  function grupoPrestamo(titulo,color,rows){

  // ----- Exportar a Excel (CSV) -----
  document.addEventListener("click", function(e){
    var b=e.target.closest(".xls"); if(!b) return;

  });
  function exportar(k){
    var rows=[], nombre="pescafacil";
    if(k==="resumen"){ var d=(state.cache.resumen||{}).d; nombre="resumen_"+state.fecha;
      rows=[["Concepto","Valor"]];
      if(d){ rows.push(["Contado",d.contado],["Fiado",d.credito],["Abonos",d.abonos],["Recaudado",d.recaudado],["Kilos",d.kilos]); }
    } else if(k==="caja"){ nombre="caja_"+state.fecha; var cc2=state.cache.cierre;
      rows=[["Concepto","Detalle","Valor"]];
      if(cc2 && cc2.hecho){
        rows.push(["Venta de contado","",cc2.venta_contado],["Abonos","",cc2.abonos],["Base de ayer (se descuenta)","",cc2.base_ayer],
                  ["Efectivo contado","",cc2.efectivo],["Nequi","",cc2.nequi],["Transferencia","",cc2.transferencia],["Daviplata","",cc2.daviplata],
                  ["Gastos","",cc2.gastos],["Pagos","",cc2.pagos],["Diferencia del día","",cc2.diferencia],
                  ["Base para mañana","",cc2.base_manana],["A entregar","",Number(cc2.efectivo||0)-Number(cc2.base_manana||0)]);
      }
      var nom={nequi:"Nequi",gasto:"Gasto",pago:"Pago"};
      ((cc2&&cc2.items)||[]).forEach(function(i){ if(nom[i.tipo]) rows.push([nom[i.tipo], i.detalle||"", i.monto]); }); }
    else if(k==="trans"){ nombre="transacciones_"+state.fecha;
      rows=[["Hora","Tipo","Producto/Detalle","Kilos","Precio","Valor","Cliente","Pago","Viaje","Estado"]].concat((state.cache.trans||[]).map(function(r){ return [r.hora,r.tipo,r.producto||r.detalle,r.kilos,r.precio,r.valor,r.cliente,r.pago,r.viaje,r.estado]; })); }
    else if(k==="bancos"){ nombre="cuentas_bancos_"+state.fecha;
      rows=[["Hora","Clase","Caja","Tipo","Categoría","Detalle","Monto"]].concat((state.cache.bancos||[]).map(function(r){ return [r.hora,r.clase==="guardado"?"Guardado":"Movimiento",nombreCaja(r.caja),r.tipo,r.categoria,r.detalle,r.monto]; })); }
    else if(k==="cartera"){ nombre="cartera"; rows=[["Cliente","Saldo","Días sin abono"]].concat((state.cache.cartera||[]).map(function(r){return [r.nombre,r.saldo,r.dias_sin_abono];})); }
    else if(k==="cliente"){ var cc=state.cache.cliente; if(cc){ nombre="estado_"+cc.c.nombre; rows=[["Fecha","Detalle","Cargo","Abono","Saldo"]];
      if(cc.saldoAnterior!=null) rows.push(["","Saldo anterior","","",cc.saldoAnterior]);
      rows=rows.concat(cc.movs.map(function(m){ return [String(m.fecha).slice(0,10), m.detalle||m.tipo, m.cargo, m.abono, m._saldo]; })); } }
    else if(k==="inventario"){ nombre="inventario"; rows=[["Producto","Kilos","Valor costo"]].concat((state.cache.inv||[]).map(function(r){return [r.nombre,r.kilos,r.valor_costo];})); }
    else if(k==="proveedores"){ nombre="proveedores"; rows=[["Proveedor","Saldo"]].concat((state.cache.prov||[]).map(function(r){return [r.nombre,r.saldo];})); }
    else if(k==="venta"){ nombre="venta_"+state.fecha; rows=[["Producto","Kilos","Venta","Utilidad"]].concat((state.cache.venta||[]).map(function(r){return [r.producto,r.kilos,r.venta,r.utilidad];})); }
    else if(k==="prestamos"){ nombre="prestamos"; rows=[["Dirección","Contacto","Producto","Kilos","Fecha"]].concat((state.cache.prestamos||[]).map(function(r){return [r.direccion,r.contacto,r.producto,r.kilos,r.fecha];})); }
    if(rows.length<2){ say("No hay datos para exportar"); return; }
    descargarCSV(nombre, rows);
  }
  function descargarCSV(nombre, rows){
    var csv=rows.map(function(r){ return r.map(function(c){ var s=(c==null?"":String(c)); return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(";"); }).join("\r\n");
    var blob=new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8;"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=nombre.replace(/[^\w\-]+/g,"_")+".csv"; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
    say("📄 Descargando "+nombre+".csv");
  }

  // refresco periódico del "en vivo"
  setInterval(function(){ if(state.negocioId) refreshSync(); }, 30000);
})();
</script>
