  // Recibo del abono con la forma del comprobante de abono del PC.
  function dibujarRecibo(r, emp){
    var W=576, M=22, SANS='Arial,Helvetica,sans-serif';
    var cv=document.createElement("canvas"); cv.width=W; cv.height=1800;
    var g=cv.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,W,cv.height); g.fillStyle="#000"; g.textBaseline="top";
    var y=18;
    function f(px,bold){ g.font=(bold?"bold ":"")+px+"px "+SANS; }
    function ancho(t){ return g.measureText(t).width; }
    function centro(t,px,bold){ f(px,bold); while(px>14 && ancho(t)>W-2*M){ px--; f(px,bold); } g.textAlign="center"; g.fillText(t,W/2,y); y+=Math.round(px*1.3); }
    function linea(){ y+=6; g.fillRect(M,y,W-2*M,2); y+=12; }
    function dos(a,b,px,bold){ f(px,bold); g.textAlign="left"; g.fillText(a,M,y); g.textAlign="right"; g.fillText(b,W-M,y); y+=Math.round(px*1.35); }
    function campo(etq,val,px,bold){ f(24,false); g.textAlign="left"; g.fillText(etq,M,y); f(px,bold); while(px>18 && ancho(val)>W-2*M-170){ px--; f(px,bold); } g.textAlign="right"; g.fillText(val,W-M,y); y+=Math.round(Math.max(px,24)*1.3); }
    function cuerpo(logo){
      if(logo){ var tl=tamLogo(logo,W), lw=tl[0], lh=tl[1]; g.drawImage(logo,(W-lw)/2,y,lw,lh); y+=lh+12; }
      if(emp.nombre) centro(String(emp.nombre).toUpperCase(),42,true);
      if(emp.nit) centro("NIT: "+emp.nit,26,false);
      if(emp.direccion) centro("Dirección: "+emp.direccion,26,false);
      if(emp.telefono) centro("Teléfono: "+emp.telefono,26,false);
      linea();
      centro("COMPROBANTE DE ABONO",30,true);
      var fe=r.fecha.toLocaleDateString("es-CO",{day:"2-digit",month:"2-digit",year:"numeric"}), ho=r.fecha.toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"});
      dos("Fecha: "+fe, "Hora: "+ho, 24, false);
      linea();
      centro("Datos cliente",26,true); y+=2;
      var dc=r.datosCliente||{};
      campo("NOMBRE:", String(r.cliente||"").toUpperCase(), 30, true);
      campo("NIT / C.C:", dc.cedula||"N/A", 24, false);
      campo("TELÉFONO:", dc.telefono||"N/A", 24, false);
      linea();
      dos("Forma de pago:", nombreCaja(r.caja), 24, true);
      if(r.nota) dos("Nota:", r.nota, 22, false);
      linea();
      dos("Saldo anterior:", money(r.saldoAntes), 25, false);
      dos("- Abono:", "-"+money(r.monto), 25, r.destacado);
      if(!r.destacado){ y+=4; dos(r.saldoDespues<0 ? "Saldo a favor:" : "Saldo pendiente:", money(Math.abs(r.saldoDespues)), 29, true); }
      if(Math.round(r.saldoDespues)===0){ y+=6; centro("✔ PAZ Y SALVO",34,true); }
      linea(); y+=4;
      var etq=r.destacado ? "Saldo pendiente" : "Monto abonado", val=money(r.destacado ? r.saldoDespues : r.monto), px=46;
      f(px,true); while(px>26 && ancho(etq)+ancho(val)+40>W-2*M){ px-=2; f(px,true); }
      f(Math.min(px,34),true); g.textAlign="left"; g.fillText(etq,M,y+(px-Math.min(px,34))*0.6);
      f(px,true); g.textAlign="right"; g.fillText(val,W-M,y); y+=Math.round(px*1.3);
      linea();
      String(emp.pie||"¡Gracias por su pago!").split(/\r?\n/).forEach(function(l){ l=l.trim(); if(l) centro(l,22,false); });
      y+=10;
      var by=y; g.fillStyle="#e5e7eb"; g.fillRect(M,by,W-2*M,64); g.fillStyle="#000"; y+=8;
      centro("Proveedor del software: "+nomMarca(),20,true);
      centro("pescafacilbykevin@gmail.com  ·  320 967 1137",20,false);
      y=by+64;
      var out=document.createElement("canvas"); out.width=W; out.height=y+18; out.getContext("2d").drawImage(cv,0,0); return out;
    }
    return new Promise(function(ok){
      if(!emp.logo_png){ ok(cuerpo(null)); return; }
      var im=new Image(); im.onload=function(){ ok(cuerpo(im)); }; im.onerror=function(){ ok(cuerpo(null)); };
      im.src="data:image/png;base64,"+emp.logo_png;
    });
  }

  // ===== 📄 ESTADO DE CUENTA para imprimir (igual al tiquete del programa) =====
  // Saldo anterior al DESDE y saldo final AL HASTA (no el de hoy), contados hacia atrás desde lo que el
  // cliente debe hoy; una fila por pesada, abono (con su forma de pago) y devolución.
  function abrirEstadoCuenta(c){
    var o=abrirOverlay(), ov=o.ov, cerrar=o.cerrar;
    var hoyS=isoToday(), d8=new Date(); d8.setDate(d8.getDate()-6);   // últimos 7 días contando hoy
    ov.innerHTML='<div class="imp-card"><h3>📄 Estado de cuenta · '+esc(c.nombre)+'</h3>'
      +'<div class="lab">Desde</div><input type="date" id="ecDesde" value="'+iso(d8)+'" max="'+hoyS+'">'
      +'<div class="lab">Hasta</div><input type="date" id="ecHasta" value="'+hoyS+'" max="'+hoyS+'">'
      +'<p>Sale el saldo que debía antes del DESDE, cada pesada, abono y devolución del rango, y el saldo final a la fecha del HASTA.</p>'
      +'<div class="fac-bar"><button class="imp" id="ecVer">📄 Ver estado de cuenta</button><button class="sec2" id="ecX">✕ Cerrar</button></div></div>';
    el("ecX").onclick=cerrar;
    el("ecVer").onclick=function(){
      var desde=el("ecDesde").value, hasta=el("ecHasta").value;
      if(!desde || !hasta || desde>hasta){ say("Revisa las fechas: el DESDE va antes del HASTA."); return; }
      ov.innerHTML='<div class="fac-msg">Armando el estado de cuenta…</div>';
      function consulta(cols){
        return sb.from("cliente_movimiento").select(cols).eq("negocio_id", state.negocioId).eq("cliente_id", c.cliente_id)
          .gte("fecha", desde+"T00:00:00").order("fecha",{ascending:true}).limit(5000);

  function dibujarEstadoCuenta(ec, emp){
    var W=576, M=22, SANS='Arial,Helvetica,sans-serif';

    var y=18;
    function f(px,bold){ g.font=(bold?"bold ":"")+px+"px "+SANS; }
    function ancho(t){ return g.measureText(t).width; }
    function centro(t,px,bold){ f(px,bold); while(px>14 && ancho(t)>W-2*M){ px--; f(px,bold); } g.textAlign="center"; g.fillText(t,W/2,y); y+=Math.round(px*1.3); }
    function recortar(t,max){ t=String(t||""); if(ancho(t)<=max) return t; while(t.length>1 && ancho(t+"…")>max) t=t.slice(0,-1); return t+"…"; }
    function linea(){ y+=6; g.fillRect(M,y,W-2*M,2); y+=12; }

    function saldoLinea(etq,val,px,bold,subrayar){
      f(px,bold); g.textAlign="left"; g.fillText(etq,M+40,y); g.textAlign="right"; g.fillText(val,W-M,y); y+=Math.round(px*1.35);
      if(subrayar){ g.fillRect(W-M-220,y,220,2); g.fillRect(W-M-220,y+5,220,2); y+=14; }
    }
    function fechaCorta(s){ s=String(s); return s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(2,4); }
    function fechaLarga(s){ s=String(s); return s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4); }
    function num(n){ return Math.round(Number(n||0)).toLocaleString("es-CO"); }
    function cuerpo(logo){
      if(logo){ var tl=tamLogo(logo,W), lw=tl[0], lh=tl[1];
        g.drawImage(logo,(W-lw)/2,y,lw,lh); y+=lh+12; }
      if(emp.nombre) centro(String(emp.nombre).toUpperCase(),42,true);
      if(emp.nit) centro("NIT: "+emp.nit,26,false);

      linea();
      centro("ESTADO DE CUENTA",30,true);
      // El nombre del cliente grande; si no cabe se achica y, como último recurso, baja a otro renglón.
      (function(){
        var nom=String(ec.cliente||"").toUpperCase(), max=W-2*M-110, px=32;
        f(24,false); g.textAlign="left"; g.fillText("Cliente:",M,y+4);
        f(px,true); while(px>24 && ancho(nom)>max){ px--; f(px,true); }
        var lineas=[nom];
        if(ancho(nom)>max){ var pal=nom.split(" "), a=""; lineas=[]; pal.forEach(function(p){ var t2=a?a+" "+p:p; if(ancho(t2)>max && a){ lineas.push(a); a=p; } else a=t2; }); if(a) lineas.push(a); }
        g.textAlign="right"; lineas.forEach(function(l){ g.fillText(recortar(l,max),W-M,y); y+=Math.round(px*1.25); });

      })();
      var ah=new Date();
      campo("Impreso el:", ah.toLocaleDateString("es-CO",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+ah.toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"}), 24, false);
      campo("Reporte del:", fechaLarga(ec.desde)+" al "+fechaLarga(ec.hasta), 24, true);
      linea();
      saldoLinea("Saldo Anterior:", num(ec.saldoAnt), 25, false, false);
      saldoLinea("Saldo Final:", num(ec.saldoFin), 29, true, false);
      y+=10;
      var xF=M, xP=112, xC=372, xU=462, xV=W-M;
      if(!ec.movs.length){ f(24,false); centro("(sin movimientos en el período)",24,false); }
      else {
        f(20,true); g.textAlign="left"; g.fillText("FECHA",xF,y); g.fillText("PRODUCTO",xP,y);
        g.textAlign="right"; g.fillText("CANT",xC,y); g.fillText("PRECIO",xU,y); g.fillText("VALOR",xV,y); y+=26;
        g.fillRect(M,y,W-2*M,2); y+=8;
        ec.movs.forEach(function(m){
          var tipo=String(m.tipo||""), prod="", cant="", precio="", valor="";
          if(tipo==="venta"){
            prod=m.producto || m.detalle || "Venta";
            cant=Number(m.kilos) ? Number(m.kilos).toLocaleString("es-CO",{maximumFractionDigits:2}) : "";

            valor=num(m.cargo);
          } else if(tipo==="abono"){
            prod="ABONO "+String(m.detalle||"").split(" · ")[0].toUpperCase();
            valor="-"+num(m.abono);
          } else if(tipo==="devolucion"){

          f(22,false);

          var hastaX = cant ? xC-ancho(cant)-12 : (precio ? xU-ancho(precio)-12 : xV-ancho(valor)-12);
          g.textAlign="left"; g.fillText(fechaCorta(m.fecha),xF,y); g.fillText(recortar(String(prod).toUpperCase(), hastaX-xP),xP,y);
          g.textAlign="right"; g.fillText(cant,xC,y); g.fillText(recortar(precio,80),xU,y); g.fillText(valor,xV,y);
          y+=31;
        });
      }
      y+=8;
      saldoLinea("Saldo Final:", num(ec.saldoFin), 29, true, true);
      centro(Number(ec.saldoFin)<0 ? "(saldo a favor del cliente al "+fechaLarga(ec.hasta)+")" : "(lo que debe al "+fechaLarga(ec.hasta)+")",20,false);
      y+=8;
      var pie=String(emp.pie||"¡Gracias por su compra!");
      pie.split(/\r?\n/).forEach(function(lin){ lin=lin.trim(); if(lin) centro(lin,22,false); });
      y+=10;
      var by=y; g.fillStyle="#e5e7eb"; g.fillRect(M,by,W-2*M,64); g.fillStyle="#000"; y+=8;
      centro("Proveedor del software: "+nomMarca(),20,true);
      centro("pescafacilbykevin@gmail.com  ·  320 967 1137",20,false);
      y=by+64;
      var out=document.createElement("canvas"); out.width=W; out.height=y+18;
      out.getContext("2d").drawImage(cv,0,0); return out;
    }
    return new Promise(function(ok){
      if(!emp.logo_png){ ok(cuerpo(null)); return; }
      var im=new Image(); im.onload=function(){ ok(cuerpo(im)); }; im.onerror=function(){ ok(cuerpo(null)); };
      im.src="data:image/png;base64,"+emp.logo_png;
    });
  }

  // ===== 📥 INGRESO DE MERCANCÍA DESDE EL CELULAR (factura del proveedor) =====
  // Queda en solicitud_movil ya aprobado; el computador lo aplica en su siguiente sincronización
  // (≤ 3 min, si está prendido) igual que el Ingreso rápido: inventario + cuenta del proveedor o caja.
  // El catálogo se vuelve a pedir si tiene más de 45 s (antes se guardaba para siempre: un proveedor
  // o producto creado en el PC no aparecía hasta recargar la página).
  function cargarCatalogo(){
    var k="cat_"+state.negocioId, c0=state.cache[k];
    if(c0 && Date.now()-c0._t < 45000) return Promise.resolve(c0);
    var claveLocal="pf_cat_"+state.negocioId;
    return base("catalogo_movil").limit(10000).then(function(r){
      var filas=(r&&!r.error&&r.data)||[];
      // 1.4.31: se guarda una copia en el celular; si la nube falla (sin señal), se usa la última.
      if(filas.length){ try{ localStorage.setItem(claveLocal, JSON.stringify({t:Date.now(), f:filas.filter(function(x){ return x.tipo!=="stock" && x.tipo!=="arqueo"; })})); }catch(e){} }
      else if(r && r.error){ try{ var g=JSON.parse(localStorage.getItem(claveLocal)||"null"); if(g && g.f) filas=g.f; }catch(e){} }
      var c={producto:[],proveedor:[],viaje:[],cliente:[],config:[], _t:Date.now()};
      filas.forEach(function(x){ (c[x.tipo]||(c[x.tipo]=[])).push(x); });
      Object.keys(c).forEach(function(t){ if(Array.isArray(c[t])) c[t].sort(function(a,b){ return String(a.nombre).localeCompare(String(b.nombre),"es"); }); });
      var cfgF=((c.config||[]).filter(function(x){ return x.nombre==="factura"; })[0]||{}).extra||{};
      LOGO_PCT=Number(cfgF.logo_pct)||100;
      TIPO_PRED=cfgF.tipo_precio||null;   // tipo de precio predeterminado del PC (1.4.31)
      state.cache[k]=c;
      // Edición del negocio (PescaFácil/CarniFácil/PolloFácil). Un PC anterior a 1.4.31 no la manda = PescaFácil.
      if((c.config||[]).length){
        var ed=MARCAS[cfgF.edicion] ? cfgF.edicion : "Pesca";
        try{ localStorage.setItem("pf_marca_"+state.negocioId, ed); }catch(e){}
        if(aplicarMarca(ed)) setTimeout(render, 0);   // otra edición: rearmar la pantalla (tipos de precio, textos)
      }
      return c;
    });
  }
  // Tamaño del logo en la factura/recibo/estado de cuenta: el de fábrica (≤300×190 en 576) por el
  // % de Configuración → Impresora del PC ("Tamaño del logo"), sin pasarse del ancho del papel.
  var LOGO_PCT=100, TIPO_PRED=null;
  // El predeterminado de Configuración del PC va primero (así queda elegido de entrada).
  function primeroPred(lista, pred, clave){ if(!pred) return lista; var i=-1; lista.forEach(function(x,j){ if((clave?x[0]:x)===pred) i=j; }); return i<=0 ? lista : [lista[i]].concat(lista.slice(0,i), lista.slice(i+1)); }
  function tamLogo(logo, W){
    var lw=Math.min(300, logo.width), lh=logo.height*lw/logo.width; if(lh>190){ lh=190; lw=logo.width*lh/logo.height; }
    var k=Math.max(0.5, Math.min(2.5, (Number(LOGO_PCT)||100)/100)); lw*=k; lh*=k;
    var max=W-44; if(lw>max){ lh=lh*max/lw; lw=max; }
    return [lw, lh];
  }
  // Valor según la UNIDAD (igual que el programa): solo la arroba divide entre 12,5.
  function valorCompra(kg,precio,unidad){ var u=String(unidad||"Arroba"); return Number(kg||0)*Number(precio||0)*1000/(u==="Arroba"?12.5: u==="Libra"?0.5:1); }
  function valorArroba(kg,precio){ return valorCompra(kg,precio,"Arroba"); }
  // Unidades de compra (las de Precios de compra del PC). Fuera de PescaFácil el kilo va primero.
  function unidadesCompra(){ return primeroPred(esPesca() ? ["Arroba","Kilo","Caja","Unidad","Libra"] : ["Kilo","Libra","Caja","Unidad","Arroba"], TIPO_PRED ? TIPO_PRED.slice(2) : null); }
  function unidadDe(p){ return (p && p.extra && p.extra.unidad) || (TIPO_PRED ? TIPO_PRED.slice(2) : esPesca()?"Arroba":"Kilo"); }
  function abrevUnidad(u){ return {Arroba:"@",Kilo:"kg",Libra:"lb",Caja:"caja",Unidad:"und"}[u] || "@"; }
  function unidadDeTipo(tp){ return tp==="x Kilo"?"Kilo": tp==="x Caja"?"Caja": tp==="x Unidad"?"Unidad": tp==="x Libra"?"Libra":"Arroba"; }
  function tipoDeUnidad(u){ return u==="Kilo"?"x Kilo": u==="Caja"?"x Caja": u==="Unidad"?"x Unidad": u==="Libra"?"x Libra":"x Arroba"; }
  // Precio que se pone solo (el predeterminado del PC; por libra el suyo o la mitad, como en el PC).
  function precioSugerido(p,tp){ var x=(p&&p.extra)||{}; return Number(tp==="x Libra" ? x.precio_libra : x.precio_venta)||0; }
  // Elegir producto: tipo de precio de su unidad y, si la casilla está vacía, su precio.
  function ponerProducto(selT, inP, p){
    if(!p) return;
    selT.value=tipoPrecioDe(p); selT._tp=selT.value;
    var sp=precioSugerido(p, selT.value); if(!inP.value && sp) inP.value=String(sp).replace(".",",");
  }
  // Cambiar kilo ↔ libra: si el precio era el sugerido (o está vacío), pasa al del otro tipo.
  function enlazarTipoPrecio(selT, inP, getP){
    selT._tp=selT.value;
    selT.addEventListener("change", function(){
      var p=getP(), antes=selT._tp; selT._tp=selT.value;
      if(!p) return;
      var v=leerNum(inP.value), sa=precioSugerido(p,antes), sn=precioSugerido(p,selT.value);
      if(sn && (!v || v===sa)) inP.value=String(sn).replace(".",",");
    });
  }
  function buscarPorNombre(lista, t){

    function agregar(){

    // Viaje de COMPRA con proveedor y no hay proveedor elegido: se pone el del viaje (así la compra se le carga a él).

          .sort(function(a,b){ return String((b.extra||{}).fecha||"").localeCompare(String((a.extra||{}).fecha||"")) || b.id-a.id; })[0];

      var viajeRefNuevo = el("iViajeRef").value.trim();

      var resumen = "Ingreso"+(provNom?" de "+provNom:"")+": "+resumenL.join(" + ")+" = "+money(tot)+(ivaE?" + IVA "+money(ivaE):"")+(ret?" − retención "+money(ret):"")+(ivaE||ret?" = "+money(tot+ivaE-ret):"")+" · "+formaTxt+" · viaje "+viajeNom

  // ===== 🛒 VENTA EXTERNA (vendí por fuera del mostrador: en la calle, por teléfono…) =====

  // Tipos de precio de la venta (los mismos del PC). Libra = 500 g: kilos × 2 × precio.
  function tiposPrecio(){ return primeroPred(esPesca() ? [["x Arroba","@"],["x Kilo","kg"],["x Unidad","und"],["x Caja","caja"],["x Libra","lb"]]
                                           : [["x Kilo","kg"],["x Libra","lb"],["x Unidad","und"],["x Caja","caja"],["x Arroba","@"]], TIPO_PRED, true); }
  function subtotalVenta(kg,precio,tipo){ return Number(kg||0)*Number(precio||0)*1000/(tipo==="x Arroba"?12.5: tipo==="x Libra"?0.5:1); }
  function tipoPrecioDe(p){ return tipoDeUnidad(unidadDe(p)); }
  function loadVentaExterna(){

      var ABREV={"x Arroba":"@","x Kilo":"kg","x Caja":"cj","x Unidad":"un","x Libra":"lb"};
      Array.prototype.forEach.call(lineas.querySelectorAll(".ilin"), function(row){
        var nom=row.querySelector(".n").value.trim(), k=leerNum(row.querySelector(".k").value), pr=leerNum(row.querySelector(".p").value), tp=row.querySelector(".t").value;
        if(!nom && !k) return;
        if(!nom){ malo="Hay una línea con kilos pero sin producto."; return; }
        var p=porNombre(nom), nombreProd = p ? p.nombre : nom.toUpperCase();
        if(!(k>0)){ malo="Faltan los kilos de "+nombreProd+"."; return; }
        if(!(pr>0)){ malo="Falta el precio de "+nombreProd+"."; return; }
        var unidadNueva = unidadDeTipo(tp);
        items.push(p ? {producto_id:p.id, kilos:k, precio:pr, tipo_precio:tp}
                     : {producto_id:0, producto_nuevo:{nombre:nombreProd, unidad:unidadNueva}, kilos:k, precio:pr, tipo_precio:tp});
        tot+=subtotalVenta(k,pr,tp);
        paraTiquete.push({ producto:nombreProd, kilos:k, precio:pr.toLocaleString("es-CO",{maximumFractionDigits:2})+" "+(ABREV[tp]||"@"), valor:subtotalVenta(k,pr,tp) });
        resumenL.push(nombreProd+(p?"":" (nuevo)")+" "+kilos(k)+" kg @"+pr+" "+(tiposPrecio().filter(function(t){ return t[0]===tp; })[0]||["","@"])[1]);
      });
      if(malo){ say(malo); return; }
      if(!items.length){ say("Agrega al menos un producto con kilos y precio."); return; }
      var t=cli.value.trim(), c=clienteSel();
      var pago = t ? "credito" : "contado";
      var caja = pago==="contado" ? el("vCaja").value : "";
      if(caja==="MIXTO"){
        var dig=mixtoDigital();
        if(dig>tot){ say("El pago mixto se pasa del total de la venta."); return; }
        var formas=Array.prototype.filter.call(document.querySelectorAll(".vMix"), function(i){ return i.getAttribute("data-c")!==cajaResto() && leerNum(i.value)>0; }).length + (tot-dig>0?1:0);
        if(dig<=0 || formas<2){ say("Para un pago mixto pon al menos dos formas de pago (la marcada se completa con el resto)."); return; }
        caja=cajaMixta();
      }
      var cliTxt = !t ? "contado" : c ? c.nombre : t.toUpperCase()+" (nuevo)";
      var resumen = "Venta externa a "+cliTxt+": "+resumenL.join(" + ")+" = "+money(tot)+" · "+(pago==="credito"?"a crédito":"de contado ("+textoCaja(caja,tot)+")")
        +(el("vDet").value.trim()?" · "+el("vDet").value.trim():"");
      if(!confirm("¿Registrar esta venta?\n\n"+resumen)) return;
      var detTxt=el("vDet").value.trim();
      var imprimirFac=el("vImp").checked, facConSaldo=el("vSal").checked;
      btn.disabled=true; btn.textContent="Enviando…";
      sb.auth.getSession().then(function(ss){
        var email=(ss.data&&ss.data.session&&ss.data.session.user&&ss.data.session.user.email)||"";
        return sb.from("solicitud_movil").insert({
          negocio_id:state.negocioId, origen:"celular", tipo:"venta", estado:"aprobada", creado_por:email, resumen:resumen,
          datos:{
            cliente_id: c ? Number(c.id) : null,
            cliente_nuevo: t && !c ? { nombre:t.toUpperCase(), telefono:el("vCliTel").value.trim() } : null,
            pago:pago, caja:caja, viaje_id: el("vViaje").value ? Number(el("vViaje").value) : null,
            detalle: el("vDet").value.trim(), lineas:items }
        });
      }).then(function(res){
        btn.disabled=false; btn.textContent="📨 Registrar venta";
        if(res.error){
          say(/row-level security|policy/i.test(res.error.message) ? "La nube todavía no acepta ventas desde el celular (falta actualizar el servidor)." : "No se pudo enviar: "+res.error.message);
          return;
        }
        say("📨 Venta enviada. El computador la registra en unos minutos.");
        delete state.cache["cat_"+state.negocioId]; olvidarPendientes();
        loadVentaExterna();
        // Tiquete para imprimir ya mismo con la impresora del celular (aún sin número: el PC se lo pone).
        var saldoCli = c && c.extra ? Number(c.extra.saldo||0) : 0;
        var datosCli = null;
        if(t){ datosCli={ nombre: c ? c.nombre : t.toUpperCase() }; if(c && c.extra) Object.keys(c.extra).forEach(function(k){ datosCli[k]=c.extra[k]; }); }
        var facCel={ ventaId:"celular", numLab:"Venta", numVal:"del celular", num:"COMPROBANTE DE VENTA", titulo:detTxt,
          fecha:new Date(), pago: pago==="credito" ? "Crédito" : "Contado", cliente: t ? (c ? c.nombre : t.toUpperCase()) : "CONTADO",
          datosCliente: datosCli, lineas: paraTiquete, total: tot,
          saldo: (pago==="credito" && c) ? { antes: saldoCli, despues: saldoCli+tot } : null };
        if(imprimirFac){
          var o=abrirOverlay();
          cargarEmpresa().then(function(emp){ mostrarFactura(o.ov, facCel, emp, o.cerrar, { conSaldo:facConSaldo, imprimir:true }); });
        }
      });
    };
  }

  // ===== 👤 USUARIOS: crear usuarios y cambiar rol / contraseña / permisos desde el celular =====
  // Igual que el ingreso: queda en solicitud_movil (tipo 'usuario', ya aprobada) y el computador lo
  // aplica en su siguiente sincronización. La contraseña no viaja: se manda su huella SHA-256 (la
  // misma que guarda el programa) y la nube la borra apenas el computador la usa.
  function esDueno(){ var n=(state.negocios||[]).filter(function(x){ return x.id===state.negocioId; })[0]; return !n || !n.rol || n.rol==="dueno"; }
  function sha256Hex(txt){
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
    });
  }
  function loadUsuarios(){
    var host=sec("usuarios"); host.innerHTML='<div class="loading">Cargando…</div>';
    delete state.cache["cat_"+state.negocioId]; olvidarPendientes();   // siempre fresco: lo que cambió el computador
    Promise.all([
      cargarCatalogo(),
      sb.from("solicitud_movil").select("id,creado,resumen,estado,error,datos").eq("negocio_id", state.negocioId).eq("tipo","usuario").order("id",{ascending:false}).limit(15)
    ]).then(function(r){
      if(state.section!=="usuarios") return;
      pintarUsuarios(r[0], (r[1]&&r[1].data)||[]);
    });
  }
  function pintarUsuarios(cat, enviados){
    var host=sec("usuarios"), usuarios=cat.usuario||[], roles=cat.rol||[];
    if(!(cat.modulo||[]).length){
      host.innerHTML='<div class="sechead"><h2 class="sec">Usuarios</h2></div><div class="empty">Para manejar los usuarios desde aquí, el programa del computador tiene que estar actualizado a la versión nueva. Ábrelo y espera unos minutos.</div>';
      return;
    }
    // Usuarios con un cambio enviado que el computador aún no aplica.
    var enCamino={};
    enviados.forEach(function(s){ if(s.estado==="aprobada" && s.datos && Number(s.datos.usuario_id)>0) enCamino[String(s.datos.usuario_id)]=true; });
    var h='<div class="sechead"><h2 class="sec">Usuarios del programa</h2></div>';
    if(!esDueno()) h+='<div class="empty" style="padding:12px">Solo la cuenta del dueño puede crear o cambiar usuarios.</div>';
    h+='<div class="card">'+usuarios.map(function(u){
      var x=u.extra||{}, perms=(x.permisos||[]).filter(function(p){ return p.ver; }).length;
      var camino=enCamino[String(u.id)];
      return '<div class="usr" data-u="'+u.id+'"><div><div class="n">'+esc(u.nombre||x.usuario)+'</div><div class="m">@'+esc(x.usuario||"")+' · '+(x.es_admin?'puede todo':perms+' módulo'+(perms===1?'':'s'))+'</div></div>'
        +'<div class="p"><span class="pill info">'+esc(x.rol||"")+'</span>'+(x.activo?'':'<span class="pill bad">Inactivo</span>')+(camino?'<span class="pill warn">⏳ Cambio en camino</span>':'')+'</div></div>';
    }).join("")+'</div>';
    if(esDueno()) h+='<button class="btn" id="uNuevo" style="margin-top:12px">➕ Usuario nuevo</button>';
    h+='<p class="updated">Los cambios los aplica el computador en unos minutos (tiene que estar prendido y con internet). Si el usuario tiene la sesión abierta, sus permisos nuevos cuentan al volver a entrar.</p>';
    h+='<div class="sechead" style="margin-top:18px"><h2 class="sec">Últimos cambios enviados</h2></div>';
    h+= enviados.length ? '<div class="card">'+enviados.map(function(s){
        return '<div class="solc"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="m">'+new Date(s.creado).toLocaleString("es-CO",{day:"2-digit",month:"short",hour:"numeric",minute:"2-digit"})+'</span>'+pillSolicitud(s)+'</div>'
          +'<div class="r">'+esc(s.resumen)+'</div>'+(s.error?'<div class="m" style="color:var(--bad)">'+esc(s.error)+'</div>':'')+'</div>';
      }).join("")+'</div>' : '<div class="empty">Aún no has enviado cambios de usuarios desde el celular.</div>';
    host.innerHTML=h;
    if(el("uNuevo")) el("uNuevo").onclick=function(){ editarUsuario(cat, null); };
    Array.prototype.forEach.call(host.querySelectorAll(".usr"), function(row){
      row.onclick=function(){
        var u=usuarios.filter(function(x){ return String(x.id)===row.getAttribute("data-u"); })[0];
        if(!u) return;
        if((u.extra||{}).es_admin){ say("El usuario Admin principal solo se cambia desde el computador."); return; }
        if(!esDueno()){ say("Solo la cuenta del dueño puede cambiar usuarios."); return; }
        editarUsuario(cat, u);
      };
    });
  }
  function editarUsuario(cat, u){
    var host=sec("usuarios"), x=(u&&u.extra)||{}, nuevo=!u;
    var roles=(cat.rol||[]).filter(function(r){ return !(r.extra&&r.extra.es_admin); });
    var modulos=(cat.modulo||[]).slice().sort(function(a,b){ return a.id-b.id; });
    var permisos={};   // clave -> {ver,crear,editar,eliminar}
    function cargar(lista){ permisos={}; (lista||[]).forEach(function(p){ permisos[p.modulo]={ver:!!p.ver,crear:!!p.crear,editar:!!p.editar,eliminar:!!p.eliminar}; }); }
    function plantilla(rolId){ var r=roles.filter(function(r){ return String(r.id)===String(rolId); })[0]; return (r&&r.extra&&r.extra.plantilla)||[]; }
    var rolIni = nuevo ? ((roles.filter(function(r){ return /cajer/i.test(r.nombre); })[0]||roles[0]||{}).id) : x.rol_id;
    cargar(nuevo ? plantilla(rolIni) : x.permisos);

    var h='<div class="sechead"><h2 class="sec">'+(nuevo?'Usuario nuevo':'Cambiar usuario @'+esc(x.usuario))+'</h2></div>';
    h+='<div class="card"><div class="form">'
      +'<label for="uLogin">Usuario (con el que entra al programa)</label><input id="uLogin" maxlength="40" autocomplete="off" autocapitalize="none" value="'+esc(x.usuario||"")+'">'
      +'<label for="uNombre">Nombre completo</label><input id="uNombre" maxlength="80" value="'+esc(u?u.nombre:"")+'">'
      +'<label for="uRol">Rol</label><select id="uRol">'+roles.map(function(r){ return '<option value="'+r.id+'"'+(String(r.id)===String(rolIni)?' selected':'')+'>'+esc(r.nombre)+'</option>'; }).join("")+'</select>'
      +'<label class="chk"><input type="checkbox" id="uActivo"'+(nuevo||x.activo?' checked':'')+'> Activo (puede entrar al programa)</label>'
      +'<label for="uPass">'+(nuevo?'Contraseña':'Contraseña nueva (déjala vacía para no cambiarla)')+'</label><input id="uPass" type="password" maxlength="60" autocomplete="new-password">'
      +'<label for="uPass2">Repetir la contraseña</label><input id="uPass2" type="password" maxlength="60" autocomplete="new-password">'
      +'<label class="chk"><input type="checkbox" data-ver="uPass,uPass2"> Mostrar contraseñas</label>'
      +'</div></div>';
    h+='<div class="sechead" style="margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 class="sec">Permisos</h2><button type="button" class="btn2" id="uPlantilla">↺ Los del rol</button></div>';
    h+='<div class="card" style="padding:4px 12px 10px"><table class="perm"><thead><tr><th>Módulo</th><th>Ver</th><th>Crear</th><th>Editar</th><th>Borrar</th></tr></thead><tbody id="uPerm"></tbody></table></div>';
    h+='<button class="btn" id="uGuardar" style="margin-top:12px">📨 Enviar al sistema</button>';
    h+='<button class="btn2" id="uVolver" style="margin-top:10px;width:100%">← Volver a la lista</button>';
    host.innerHTML=h; window.scrollTo(0,0);

    function pintarPermisos(){
      var filas="", secc="";
      modulos.forEach(function(m){
        var e=m.extra||{}, p=permisos[e.clave]||{};
        if(e.seccion!==secc){ secc=e.seccion; filas+='<tr class="secc"><td colspan="5">'+esc(secc)+'</td></tr>'; }
        filas+='<tr><td>'+esc(m.nombre)+'</td>'+["ver","crear","editar","eliminar"].map(function(k){
          return '<td><input type="checkbox" data-m="'+esc(e.clave)+'" data-k="'+k+'"'+(p[k]?' checked':'')+' aria-label="'+esc(m.nombre)+' '+k+'"></td>'; }).join("")+'</tr>';
      });
      el("uPerm").innerHTML=filas;
      Array.prototype.forEach.call(el("uPerm").querySelectorAll("input"), function(c){
        c.onchange=function(){
          var m=c.getAttribute("data-m"), k=c.getAttribute("data-k"), p=permisos[m]||(permisos[m]={ver:false,crear:false,editar:false,eliminar:false});
          p[k]=c.checked;
          if(k!=="ver" && c.checked) p.ver=true;                                 // sin "ver" lo demás no sirve
          if(k==="ver" && !c.checked){ p.crear=p.editar=p.eliminar=false; }
          pintarPermisos();
        };
      });
    }
    pintarPermisos();
    el("uRol").onchange=function(){ if(nuevo){ cargar(plantilla(this.value)); pintarPermisos(); } };
    el("uPlantilla").onclick=function(){
      if(!confirm("¿Poner los permisos por defecto del rol "+el("uRol").options[el("uRol").selectedIndex].text+"?")) return;
      cargar(plantilla(el("uRol").value)); pintarPermisos();
    };
    el("uVolver").onclick=function(){ loadUsuarios(); };
    el("uGuardar").onclick=function(){
      var btn=this, login=el("uLogin").value.trim(), nombre=el("uNombre").value.trim(), rolId=Number(el("uRol").value),
          activo=el("uActivo").checked, p1=el("uPass").value, p2=el("uPass2").value;
      if(!login){ say("Escribe el usuario con el que entra."); el("uLogin").focus(); return; }
      if(!nombre){ say("Escribe el nombre completo."); el("uNombre").focus(); return; }
      if(!rolId){ say("Elige el rol."); return; }
      if((cat.usuario||[]).some(function(o){ return (!u || o.id!==u.id) && String((o.extra||{}).usuario||"").toLowerCase()===login.toLowerCase(); })){ say("Ya existe otro usuario '"+login+"'."); return; }
      if(nuevo && !p1){ say("Un usuario nuevo necesita contraseña."); el("uPass").focus(); return; }
      if(p1 && p1.length<4){ say("La contraseña debe tener al menos 4 caracteres."); el("uPass").focus(); return; }
      if(p1!==p2){ say("Las contraseñas no coinciden."); el("uPass2").focus(); return; }
      var lista=Object.keys(permisos).filter(function(k){ var p=permisos[k]; return p.ver||p.crear||p.editar||p.eliminar; })
        .map(function(k){ var p=permisos[k]; return {modulo:k, ver:true, crear:!!p.crear, editar:!!p.editar, eliminar:!!p.eliminar}; });
      var rolNom=el("uRol").options[el("uRol").selectedIndex].text;
      var cambios=[];
      if(nuevo) cambios.push("rol "+rolNom, lista.length+" módulo"+(lista.length===1?"":"s"));
      else {
        if(login!==x.usuario) cambios.push("usuario @"+x.usuario+" → @"+login);
        if(nombre!==u.nombre) cambios.push("nombre "+nombre);
        if(String(rolId)!==String(x.rol_id)) cambios.push("rol "+(x.rol||"")+" → "+rolNom);
        if(activo!==!!x.activo) cambios.push(activo?"activado":"DESACTIVADO");
        if(p1) cambios.push("contraseña nueva");
        var antes=JSON.stringify((x.permisos||[]).map(function(p){ return [p.modulo,!!p.ver,!!p.crear,!!p.editar,!!p.eliminar]; }).sort());
        var ahora=JSON.stringify(lista.map(function(p){ return [p.modulo,p.ver,p.crear,p.editar,p.eliminar]; }).sort());
        if(antes!==ahora) cambios.push("permisos ("+lista.length+" módulo"+(lista.length===1?"":"s")+")");
        if(!cambios.length){ say("No cambiaste nada."); return; }
      }
      var resumen=(nuevo?"Usuario nuevo @"+login+" ("+nombre+")":"Usuario @"+(x.usuario||login))+": "+cambios.join(" · ");
      if(!confirm("¿Enviar este cambio al sistema?\n\n"+resumen)) return;
      btn.disabled=true; btn.textContent="Enviando…";
      (p1 ? sha256Hex(p1) : Promise.resolve("")).then(function(hash){
        return sb.auth.getSession().then(function(ss){
          var email=(ss.data&&ss.data.session&&ss.data.session.user&&ss.data.session.user.email)||"";
          var datos={ usuario_id: nuevo?0:u.id, usuario:login, nombre:nombre, rol_id:rolId, activo:activo, permisos:lista };
          if(hash) datos.password_hash=hash;
          return sb.from("solicitud_movil").insert({ negocio_id:state.negocioId, origen:"celular", tipo:"usuario", estado:"aprobada", creado_por:email, resumen:resumen, datos:datos });
        });
      }).then(function(res){
        btn.disabled=false; btn.textContent="📨 Enviar al sistema";
        if(res.error){ say(/row-level|policy/i.test(res.error.message) ? "Solo la cuenta del dueño puede cambiar usuarios (o falta actualizar la base de la nube)." : "No se pudo enviar: "+res.error.message); return; }
        say("📨 Enviado. El computador lo aplica en unos minutos.");
        loadUsuarios();
      });
    };
  }

  // ===== 🛡️ CAMBIOS: solicitudes del cajero (aprobar/rechazar) + registro de cambios del programa =====
  state.audFiltro="Todo";

    if(/ANUL/.test(a)) return "Anulaciones";

  function loadCambios(){

    var neg=state.negocioId, fecha=state.fecha;

    // elegido en la barra de fechas (‹ Hoy ›).
    var ini=new Date(fecha+"T00:00:00"), fin=new Date(ini.getTime()+86400000);

      sb.from("solicitud_movil").select("*").eq("negocio_id", neg).eq("estado","pendiente").order("id",{ascending:true}),

        .gte("creado", ini.toISOString()).lt("creado", fin.toISOString()).order("id",{ascending:false}).limit(100),
      base("auditoria_mov").eq("fecha", fecha).order("momento",{ascending:false}).limit(500)
    ]).then(function(r){

      pintarCambios((r[0]&&r[0].data)||[], (r[1]&&r[1].data)||[]);

          +'<div class="m">Pidió: '+esc(s.creado_por||"—")+' · '+new Date(s.creado).toLocaleString("es-CO",{day:"2-digit",month:"short",hour:"numeric",minute:"2-digit"})+'</div>'
          +'<div class="b"><button class="no" data-no="'+s.id+'">❌ Rechazar</button><button class="ok" data-si="'+s.id+'">✅ Aprobar</button></div></div>';

          +'<div class="r">'+esc(s.resumen)+'</div>'

          +(s.error?'<div class="m" style="color:var(--bad)">'+esc(s.error)+'</div>':'')+'</div>';
      }).join("")+'</div>' : '<div class="empty">Sin solicitudes este día.</div>';

    h+='<div id="audLista"></div>';

    Array.prototype.forEach.call(host.querySelectorAll("[data-si]"), function(b){ b.onclick=function(){ decidir(Number(b.dataset.si), true); }; });
    Array.prototype.forEach.call(host.querySelectorAll("[data-no]"), function(b){ b.onclick=function(){ decidir(Number(b.dataset.no), false); }; });
    Array.prototype.forEach.call(host.querySelectorAll("[data-af]"), function(b){ b.onclick=function(){ state.audFiltro=b.dataset.af; pintarAuditoria(); Array.prototype.forEach.call(host.querySelectorAll("[data-af]"), function(x){ x.classList.toggle("on", x===b); }); }; });

  function pintarAuditoria(){

    box.innerHTML='<div class="card">'+rows.slice(0,200).map(function(a){
      var cls=claseAccion(a.accion);
      return '<div class="audr '+CLASE_COLOR[cls]+'"><div style="display:flex;justify-content:space-between;gap:8px"><span class="a">'+esc(nombreAccion(a.accion))+'</span>'

        +(a.usuario?'<div class="d">👤 '+esc(a.usuario)+'</div>':'')+'</div>';

  // Auditoría que se entiende (igual que el programa, CambiosAuditoria): nombre claro de la acción y,
  // de cada corrección, solo lo que cambió: "MOJARRA kilos: 10 kg → 12 kg", un renglón por campo.
  var NOMBRES_ACCION={VENTA:"🧾 Venta",EDITAR_VENTA:"✏️ Corrigió una venta",ANULAR_VENTA:"🚫 Anuló una venta",
    ABONO:"💰 Abono",EDITAR_ABONO:"✏️ Corrigió un abono",ANULAR_ABONO:"🚫 Anuló un abono",
    PAGO:"💵 Pago a proveedor",EDITAR_PAGO:"✏️ Corrigió un pago a proveedor",ANULAR_PAGO:"🚫 Anuló un pago a proveedor",
    EGRESO:"📤 Gasto / salida",INGRESO:"📥 Entrada de plata",EDITAR_MOVIMIENTO:"✏️ Corrigió un gasto",ANULAR_MOVIMIENTO:"🚫 Anuló un gasto",
    GASTO_A_PROVEEDOR:"📤 Gasto descontado al proveedor",INGRESO_RAPIDO:"📥 Ingreso de mercancía",EDITAR_INGRESO:"✏️ Corrigió un ingreso de mercancía",
    ANULAR_INGRESO:"🚫 Anuló un ingreso de mercancía",EDITAR_COMPRA:"✏️ Corrigió una compra a proveedor",
    DEVOLUCION:"↩️ Devolución",EDITAR_DEVOLUCION:"✏️ Corrigió una devolución",ANULAR_DEVOLUCION:"🚫 Anuló una devolución",
    PRESTAMO:"🤝 Préstamo",EDITAR:"✏️ Corrigió",ANULAR:"🚫 Anuló",CREAR:"➕ Creó",PAGO_COMISION:"💼 Pago a comisionista",
    EDITAR_PAGO_COMISION:"✏️ Corrigió un pago a comisionista",ANULAR_PAGO_COMISION:"🚫 Anuló un pago a comisionista",
    CIERRE_CAJA:"🧮 Cierre de caja",ARQUEO_PERSONA:"🛵 Arqueo por persona",SOLICITUD_RECHAZADA:"❌ Rechazó una solicitud"};
  function nombreAccion(a){ a=String(a||""); if(NOMBRES_ACCION[a]) return NOMBRES_ACCION[a];
    var t=cap(a.replace(/_/g," ").toLowerCase()); return (/ANUL/.test(a)?"🚫 ":/EDITAR|CORREG|DESHACER|QUITAR/.test(a)?"✏️ ":"")+t; }
  function cambiosHTML(antes, despues){
    antes=String(antes||"").trim(); despues=String(despues||"").trim();
    if(!antes && !despues) return "";
    var a=antes.split("\n"), d=despues.split("\n");
    if(antes && despues && a.length===d.length){
      var filas=[], ok=true;
      for(var i=0;i<a.length && ok;i++){
        var pa=a[i].indexOf(": "), pd=d[i].indexOf(": ");
        if(pa>0 && pd>0 && a[i].slice(0,pa)===d[i].slice(0,pd))
          filas.push('<div class="aud-c"><b>'+esc(a[i].slice(0,pa))+'</b> <span class="aud-a">'+esc(a[i].slice(pa+2))+'</span> → <span class="aud-d">'+esc(d[i].slice(pd+2))+'</span></div>');
        else ok=false;
      }
      if(ok) return '<div class="aud-cambios">'+filas.join("")+'</div>';
    }
    if(!antes) return '<div class="aud-cambios"><div class="aud-c">'+esc(despues).replace(/\n/g," · ")+'</div></div>';
    if(!despues) return '<div class="aud-cambios"><div class="aud-c">'+esc(antes).replace(/\n/g," · ")+'</div></div>';
    return '<div class="aud-cambios"><div class="aud-c"><span class="aud-a">'+esc(antes).replace(/\n/g," · ")+'</span> → <span class="aud-d">'+esc(despues).replace(/\n/g," · ")+'</span></div></div>';
  }
  function decidir(id, aprobar){
    if(!confirm(aprobar ? "¿APROBAR? El computador lo hace solo en unos minutos." : "¿RECHAZAR esta solicitud? No se cambia nada.")) return;
    sb.rpc("decidir_solicitud", { p_id:id, p_aprobar:aprobar }).then(function(res){
      if(res.error){ say("No se pudo: "+res.error.message); return; }
      say(res.data==="ok" ? (aprobar?"✅ Aprobada. El computador la aplica en unos minutos.":"❌ Rechazada.") : String(res.data));
      loadCambios();
    });
  }
  // Insignia en el chip "Cambios" con las solicitudes que esperan decisión (se revisa cada 30 s).
  var pendientesAntes=-1;
  var ultimoPendientes=0;
  function pintarBadge(n){
    var b=el("badgeCambios"); if(!b) return;
    b.hidden = !n; b.textContent = n; ultimoPendientes=n;
    // Franja visible arriba de TODAS las pantallas (la pestaña Cambios queda escondida al final de la
    // barra y el número rojo pasaba desapercibido). En la propia pantalla de Cambios no hace falta.
    var ban=el("bannerSol");
    if(ban){
      ban.hidden = !n || state.section==="cambios";
      ban.innerHTML = "🛡️ "+n+(n===1?" solicitud esperando":" solicitudes esperando")+" tu aprobación <b>· Ver ›</b>";
      ban.onclick=function(){ var c=document.querySelector('.chip[data-s="cambios"]'); if(c){ c.click(); try{ c.scrollIntoView({inline:"center", block:"nearest"}); }catch(e){} } };
    }
    if(pendientesAntes>=0 && n>pendientesAntes){
      if(tiposActivos().indexOf("__sol")<0) say("🛡️ Hay una solicitud de cambio esperando tu aprobación");
      try{ if(window.Notification && Notification.permission==="granted") new Notification(nomMarca(), { body:"Hay una solicitud de cambio esperando tu aprobación" }); }catch(e){}
    }

  function contarPendientes(){
    if(!state.negocioId) return;
    sb.from("solicitud_movil").select("id",{count:"exact", head:true}).eq("negocio_id", state.negocioId).eq("estado","pendiente").then(function(r){
      if(!r.error) pintarBadge(r.count||0);
    });
  }
  setInterval(contarPendientes, 30000);

  // INVENTARIO
  // Inventario: la posición de todo el patio o, con el filtro VIAJE, solo lo que queda en ese viaje
  // (catalogo_movil tipo "stock", que el PC sube desde 1.4.31; un PC anterior no lo manda y el filtro no sale).
  function loadInventario(){
    var host=sec("inv"); host.innerHTML='<div class="loading">Cargando…</div>';
    Promise.all([base("inventario"), cargarCatalogo().catch(function(){ return {}; })]).then(function(rs){
      if(state.section!=="inv") return;
      var res=rs[0], cat=rs[1]||{}, stock=cat.stock||[], viajes=cat.viaje||[];
      var conStock={}; stock.forEach(function(x){ conStock[(x.extra||{}).viaje_id]=1; });
      var lista=viajes.filter(function(v){ return conStock[v.id]; })
        .sort(function(a,b){ return String((b.extra||{}).fecha||"").localeCompare(String((a.extra||{}).fecha||"")) || b.id-a.id; });
      var vid=Number(state.invViaje||0);
      if(vid && !lista.some(function(v){ return v.id===vid; })) vid=0;
      var rows;
      if(vid){
        rows=stock.filter(function(x){ return (x.extra||{}).viaje_id===vid; }).map(function(x){
          var e=x.extra||{}; return { nombre:x.nombre, kilos:Number(e.kilos||0), fisico:Number(e.fisico||0), nos_deben:Number(e.nos_deben||0), debemos:Number(e.debemos||0), valor_costo:Number(e.valor_costo||0) };
        });
      } else rows=(res.data||[]).slice();
      rows.sort(function(a,b){ return Number(b.valor_costo)-Number(a.valor_costo) || Number(b.kilos)-Number(a.kilos); });
      var totalV=rows.reduce(function(s,r){return s+Number(r.valor_costo||0);},0);
      var totalK=rows.reduce(function(s,r){return s+Number(r.kilos||0);},0);
      var v=vid ? lista.filter(function(x){ return x.id===vid; })[0] : null, ve=(v&&v.extra)||{};
      var h='<div class="sechead"><h2 class="sec">Inventario (posición real)</h2><button class="xls" data-xls="inventario">⬇️ Excel</button></div>';
      if(lista.length){
        h+='<label class="hoja-lab" for="invViaje" style="display:block;margin:4px 0 6px">🚢 Viaje</label><select id="invViaje" class="hoja-in" style="margin-bottom:10px">'
          +'<option value="0">Todos los viajes</option>'
          +lista.map(function(x){ var e=x.extra||{}, f=String(e.fecha||"").slice(8,10)+"/"+String(e.fecha||"").slice(5,7);
              return '<option value="'+x.id+'"'+(x.id===vid?' selected':'')+'>'+esc(x.nombre)+(e.fecha?' · '+f:'')+(e.proveedor?' · '+esc(e.proveedor):'')+(e.tipo_viaje==="COMISION"?' · comisión':'')+'</option>'; }).join("")
          +'</select>';
        if(v) h+='<div class="meta" style="margin:-4px 0 10px;color:var(--muted)">Solo lo que queda en este viaje'+(ve.tipo_viaje==="COMISION"?' (de comisión: no se valora al costo, la mercancía es del comisionista)':'')+'.</div>';
      }
      h+='<div class="tiles"><div class="tile"><div class="lab">📦 Valor al costo</div><div class="val num">'+money(totalV)+'</div></div>'
        +'<div class="tile"><div class="lab">⚖️ Kilos '+(v?'en el viaje':'en patio')+'</div><div class="val num">'+kilos(totalK)+' <small>kg</small></div></div></div>';
      if(!rows.length){ h+='<div class="empty">'+(v?'Este viaje no tiene mercancía.':'No hay inventario sincronizado.')+'</div>'; host.innerHTML=h; enlazar(); state.cache.inv=rows; return; }
      h+='<div class="card">';
      rows.forEach(function(r){
        var extra = v && (r.nos_deben || r.debemos) ? ' · '+kilos(r.fisico)+' físicos'+(r.nos_deben?' + '+kilos(r.nos_deben)+' prestados':'')+(r.debemos?' − '+kilos(r.debemos)+' que me prestaron':'') : '';
        h+='<div class="row"><div class="main"><div class="name">'+esc(r.nombre)+'</div><div class="meta">'+kilos(r.kilos)+' kg disponibles'+extra+'</div></div><div class="amt num">'+money(r.valor_costo)+'</div></div>';
      });
      h+='</div><div class="card"><div class="total-row"><span>Total al costo'+(v?' del viaje':'')+'</span><span class="big num">'+money(totalV)+'</span></div></div>';
      host.innerHTML=h; state.cache.inv=rows; state.cache.invNombre = v ? "inventario-"+String(v.nombre).replace(/[^\w-]+/g,"_") : "inventario";
      enlazar();
      function enlazar(){ var s=el("invViaje"); if(s) s.onchange=function(){ state.invViaje=Number(this.value)||0; loadInventario(); }; }
    });
  }

  // PROVEEDORES
  // Proveedores tiene dos pestañas, como en el programa: lo que les debo a los proveedores y a los comisionistas.
  function tabsProv(){
    return '<div class="tfil ptabs">'+[["prov","🚛 Proveedores"],["comis","💼 Comisionistas"]].map(function(t){

      Array.prototype.forEach.call(host.querySelectorAll(".pacc.in"), function(d){ d.onclick=function(){ state.ingresoProv=d.dataset.n; irA("ingreso"); }; });

  // VENTA DIARIA

  // PRESTAMOS
  function loadPrestamos(){
    var host=sec("prestamos"); host.innerHTML='<div class="loading">Cargando…</div>';
    Promise.all([
      base("prestamos"),
      cargarCatalogo().catch(function(){ return null; }),
      sb.from("solicitud_movil").select("id,creado,resumen,estado,error").eq("negocio_id", state.negocioId).eq("tipo","prestamo").order("id",{ascending:false}).limit(8)
    ]).then(function(r){
      if(state.section!=="prestamos") return;
      var res=r[0], cat=r[1], enviados=(r[2]&&r[2].data)||[];
      var rows=res.data||[];
      // Saldo FINAL por contacto y producto (no préstamo por préstamo): se cruza lo que nos debe con lo
      // que le debemos del mismo producto, igual que en el programa.
      var porClave={};
      rows.forEach(function(r){
        var k=r.contacto+"|"+r.producto, g=porClave[k]||(porClave[k]={contacto:r.contacto, producto:r.producto, neto:0, fecha:r.fecha});
        g.neto+=(r.direccion==="NOS_DEBEN"?1:-1)*Number(r.kilos||0);
        if(String(r.fecha)>String(g.fecha)) g.fecha=r.fecha;
      });
      var saldos=Object.keys(porClave).map(function(k){ var g=porClave[k]; g.neto=Math.round(g.neto*100)/100; g.kilos=Math.abs(g.neto); return g; }).filter(function(g){ return g.neto!==0; });
      var nos=saldos.filter(function(g){return g.neto>0;});
      var deb=saldos.filter(function(g){return g.neto<0;});

      if(cat && cat.producto && cat.producto.length) h+='<button class="addl" id="pNuevoBtn" style="margin:0 0 12px">➕ Registrar préstamo (presté o me prestaron)</button><div id="pForm" hidden></div>';
      if(!saldos.length) h+='<div class="empty">No hay préstamos pendientes.</div>';
      h+=saldoPorProducto(saldos);
      h+=grupoPrestamo("↩️ Nos deben","var(--good)",nos);
      h+=grupoPrestamo("↪️ Debemos","var(--bad)",deb);

        h+='<div class="sechead" style="margin-top:18px"><h2 class="sec">Registrados desde aquí</h2></div><div class="card">'+enviados.map(function(s){
          return '<div class="solc"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="m">'+new Date(s.creado).toLocaleString("es-CO",{day:"2-digit",month:"short",hour:"numeric",minute:"2-digit"})+'</span>'+pillSolicitud(s)+'</div>'
            +'<div class="r">'+esc(s.resumen)+'</div>'+(s.error?'<div class="m" style="color:var(--bad)">'+esc(s.error)+'</div>':'')+'</div>';
        }).join("")+'</div>';
      }
      host.innerHTML=h; state.cache.prestamos=rows;
      if(el("pNuevoBtn")) el("pNuevoBtn").onclick=function(){ var f=el("pForm"); f.hidden=!f.hidden; if(!f.hidden && !f.innerHTML) formPrestamo(cat); };
    });
  }
  // ➕ Préstamo desde el celular: queda en solicitud_movil (tipo 'prestamo', ya aprobada) y el computador

      +'<label for="pViaje">Viaje</label><select id="pViaje"><option value="">Automático</option>'
      +(cat.viaje||[]).map(function(v){ return '<option value="'+v.id+'">'+esc(v.nombre)+(v.extra&&v.extra.predeterminado?' ⭐':'')+'</option>'; }).join("")+'</select>'
      +'<label for="pNota">Nota (opcional)</label><input id="pNota" maxlength="100" placeholder="Ej: lo devuelve el sábado">'
      +'</div></div><button class="btn" id="pEnviar" style="margin:0 0 14px">📨 Registrar préstamo</button>';
    function info(){
      var c=buscarPorNombre(clientes, el("pCli").value), p=buscarPorNombre(cat.producto, el("pProd").value);
      el("pCliInfo").innerHTML = !el("pCli").value.trim() ? "" : c ? "" : '<span class="nuevo-tag">➕ Cliente nuevo: se crea al registrar</span>';
      el("pProdInfo").innerHTML = !el("pProd").value.trim() ? "" : p ? "" : '<span class="nuevo-tag">➕ Producto nuevo: se crea al registrar</span>';
    }
    ["pCli","pProd"].forEach(function(id){ el(id).addEventListener("input", info); el(id).addEventListener("change", info); });
    el("pEnviar").onclick=function(){
      var btn=this, dir=(document.querySelector('input[name="pDir"]:checked')||{}).value||"NOS_DEBEN";
      var tc=el("pCli").value.trim(), tp=el("pProd").value.trim(), kg=leerNum(el("pKg").value);
      if(!tc){ say("Escribe el cliente."); el("pCli").focus(); return; }
      if(!tp){ say("Escribe el producto."); el("pProd").focus(); return; }
      if(!(kg>0)){ say("Escribe los kilos."); el("pKg").focus(); return; }
      var c=buscarPorNombre(clientes, tc), p=buscarPorNombre(cat.producto, tp);
      var cliTxt = c ? c.nombre : tc.toUpperCase()+" (nuevo)", prodTxt = p ? p.nombre : tp.toUpperCase()+" (nuevo)";
      var resumen = (dir==="NOS_DEBEN" ? "Le presté a " : "Me prestó ")+cliTxt+": "+prodTxt+" "+kilos(kg)+" kg"+(el("pNota").value.trim()?" · "+el("pNota").value.trim():"");
      if(!confirm("¿Registrar este préstamo?\n\n"+resumen)) return;
      btn.disabled=true; btn.textContent="Enviando…";
      sb.auth.getSession().then(function(ss){
        var email=(ss.data&&ss.data.session&&ss.data.session.user&&ss.data.session.user.email)||"";
        return sb.from("solicitud_movil").insert({
          negocio_id:state.negocioId, origen:"celular", tipo:"prestamo", estado:"aprobada", creado_por:email, resumen:resumen,
          datos:{ direccion:dir, cliente_id: c ? Number(c.id) : null, cliente_nuevo: c ? null : { nombre:tc.toUpperCase(), telefono:"" },
                  producto_id: p ? Number(p.id) : 0, producto_nuevo: p ? null : { nombre:tp.toUpperCase(), unidad:"Arroba" },
                  kilos:kg, viaje_id: el("pViaje").value ? Number(el("pViaje").value) : null, nota: el("pNota").value.trim() }
        });
      }).then(function(res){
        btn.disabled=false; btn.textContent="📨 Registrar préstamo";
        if(res.error){
          say(/row-level security|policy/i.test(res.error.message) ? "La nube todavía no acepta préstamos desde el celular (falta actualizar el servidor)." : "No se pudo enviar: "+res.error.message);
          return;
        }
        say("📨 Préstamo enviado. El computador lo registra en unos minutos.");
        delete state.cache["cat_"+state.negocioId]; olvidarPendientes();
        loadPrestamos();
      });
    };
  }
  // Lo de todo el patio por especie: cuánto nos deben, cuánto debemos y cómo queda cada producto.
  function saldoPorProducto(saldos){
    if(!saldos.length) return "";
    var prods={};
    saldos.forEach(function(g){ var p=prods[g.producto]||(prods[g.producto]={nos:0,deb:0}); if(g.neto>0) p.nos+=g.neto; else p.deb-=g.neto; });
    var h='<div class="sechead" style="margin-top:14px"><h2 class="sec">🐟 Saldo final por producto</h2></div><div class="card">';
    Object.keys(prods).sort().forEach(function(n){
      var p=prods[n], s=Math.round((p.nos-p.deb)*100)/100;
      h+='<div class="row"><div class="main"><div class="name">'+esc(n)+'</div><div class="meta">Nos deben '+kilos(p.nos)+' kg · Debemos '+kilos(p.deb)+' kg</div></div>'
        +'<div class="amt num" style="color:'+(s>0?'var(--good)':s<0?'var(--bad)':'inherit')+'">'+kilos(Math.abs(s))+' kg</div></div>';
    });
    return h+'</div>';
  }
  function grupoPrestamo(titulo,color,rows){
    if(!rows.length) return "";
    var h='<div class="sechead" style="margin-top:14px"><h2 class="sec" style="color:'+color+'">'+titulo+'</h2></div><div class="card">';
    rows.forEach(function(r){
      var f=r.fecha?parseISO(r.fecha).toLocaleDateString("es-CO",{day:"numeric",month:"short"}):"";
      h+='<div class="row"><div class="main"><div class="name">'+esc(r.contacto)+' · '+esc(r.producto)+'</div><div class="meta">'+f+'</div></div><div class="amt num">'+kilos(r.kilos)+' kg</div></div>';
    });
    return h+'</div>';
  }

  // ----- Exportar a Excel (CSV) -----
  document.addEventListener("click", function(e){
    // Solo los botones de Excel (con data-xls): "Ver todo", "Cerrar" o "Estado de cuenta" usan la misma
    // forma y antes mostraban "No hay datos para exportar" al tocarlos.
    var b=e.target.closest(".xls"); if(!b || !b.dataset.xls) return;
    var k=b.dataset.xls; exportar(k);
  });
  function exportar(k){
    var rows=[], nombre="pescafacil";
    if(k==="resumen"){ var d=(state.cache.resumen||{}).d; nombre="resumen_"+state.fecha;
      rows=[["Concepto","Valor"]];
      if(d){ rows.push(["Contado",d.contado],["Fiado",d.credito],["Abonos",d.abonos],["Recaudado",d.recaudado],["Kilos",d.kilos]); }
    } else if(k==="caja"){ nombre="caja_"+state.fecha; var cc2=state.cache.cierre;
      rows=[["Concepto","Detalle","Valor"]];
      if(cc2 && cc2.hecho){
        rows.push(["Venta de contado","",cc2.venta_contado],["Abonos","",cc2.abonos],["Base de ayer (se descuenta)","",cc2.base_ayer],
                  ["Efectivo contado","",cc2.efectivo],["Nequi","",cc2.nequi],["Transferencia","",cc2.transferencia],["Daviplata","",cc2.daviplata],
                  ["Gastos","",cc2.gastos],["Pagos","",cc2.pagos],["Diferencia del día","",cc2.diferencia],
                  ["Base para mañana","",cc2.base_manana],["A entregar","",Number(cc2.efectivo||0)-Number(cc2.base_manana||0)]);
      }
      var nom={nequi:"Nequi",gasto:"Gasto",pago:"Pago"};
      ((cc2&&cc2.items)||[]).forEach(function(i){ if(nom[i.tipo]) rows.push([nom[i.tipo], i.detalle||"", i.monto]); }); }
    else if(k==="trans"){ nombre="transacciones_"+state.fecha;
      rows=[["Hora","Tipo","Producto/Detalle","Kilos","Precio","Valor","Cliente","Pago","Viaje","Estado"]].concat((state.cache.trans||[]).map(function(r){ return [r.hora,r.tipo,r.producto||r.detalle,r.kilos,r.precio,r.valor,r.cliente,r.pago,r.viaje,r.estado]; })); }
    else if(k==="bancos"){ nombre="cuentas_bancos_"+state.fecha;
      rows=[["Hora","Clase","Caja","Tipo","Categoría","Detalle","Monto"]].concat((state.cache.bancos||[]).map(function(r){ return [r.hora,r.clase==="guardado"?"Guardado":"Movimiento",nombreCaja(r.caja),r.tipo,r.categoria,r.detalle,r.monto]; })); }
    else if(k==="cartera"){ nombre="cartera"; rows=[["Cliente","Saldo","Días sin abono"]].concat((state.cache.cartera||[]).map(function(r){return [r.nombre,r.saldo,r.dias_sin_abono];})); }
    else if(k==="cliente"){ var cc=state.cache.cliente; if(cc){ nombre="estado_"+cc.c.nombre; rows=[["Fecha","Detalle","Cargo","Abono","Saldo"]];
      if(cc.saldoAnterior!=null) rows.push(["","Saldo anterior","","",cc.saldoAnterior]);
      rows=rows.concat(cc.movs.map(function(m){ return [String(m.fecha).slice(0,10), m.detalle||m.tipo, m.cargo, m.abono, m._saldo]; })); } }
    else if(k==="inventario"){ nombre=state.cache.invNombre||"inventario"; rows=[["Producto","Kilos","Valor costo"]].concat((state.cache.inv||[]).map(function(r){return [r.nombre,r.kilos,r.valor_costo];})); }
    else if(k==="proveedores"){ nombre="proveedores"; rows=[["Proveedor","Saldo"]].concat((state.cache.prov||[]).map(function(r){return [r.nombre,r.saldo];})); }
    else if(k==="venta"){ nombre="venta_"+state.fecha; rows=[["Producto","Kilos","Venta","Utilidad"]].concat((state.cache.venta||[]).map(function(r){return [r.producto,r.kilos,r.venta,r.utilidad];})); }
    else if(k==="prestamos"){ nombre="prestamos"; rows=[["Dirección","Contacto","Producto","Kilos","Fecha"]].concat((state.cache.prestamos||[]).map(function(r){return [r.direccion,r.contacto,r.producto,r.kilos,r.fecha];})); }
    if(rows.length<2){ say("No hay datos para exportar"); return; }
    descargarCSV(nombre, rows);
  }
  function descargarCSV(nombre, rows){
    var csv=rows.map(function(r){ return r.map(function(c){ var s=(c==null?"":String(c)); return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(";"); }).join("\r\n");
    var blob=new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8;"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=nombre.replace(/[^\w\-]+/g,"_")+".csv"; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
    say("📄 Descargando "+nombre+".csv");
  }

  // refresco periódico del "en vivo"
  setInterval(function(){ if(state.negocioId) refreshSync(); }, 30000);
})();
</script>
